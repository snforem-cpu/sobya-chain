name: SOBYA Validator Application
description: Register interest and begin node preparation for an independent SOBYA validator.
title: "[Validator Application]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your interest in validating SOBYA.

        **This form is public.** Submit only public operator information. Never post passwords, seed phrases, private keys, validator signing keys, access tokens, or private contact details. The SOBYA team will use your GitHub account to follow up in this issue. Applications are reviewed manually.

        Applying and preparing a node are free. You may apply before your node is running; public node ID, P2P endpoint, account address, and consensus public key can be supplied later during onboarding. Submission does not guarantee admission or a support grant.
  - type: input
    id: operator
    attributes:
      label: Operator / organization name
      placeholder: Your validator operator name
    validations:
      required: true
  - type: input
    id: github
    attributes:
      label: GitHub account
      description: Your GitHub username for follow-up.
      placeholder: "@username"
    validations:
      required: true
  - type: input
    id: chain_id
    attributes:
      label: Target chain ID
      placeholder: sobya-1
      value: sobya-1
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: Intended SOBYA binary release
      description: Enter v0.1.0-rc.2 if you plan to use the currently published release.
      placeholder: v0.1.0-rc.2
    validations:
      required: true
  - type: input
    id: account
    attributes:
      label: Operator account address (if already available)
      description: Public address only. You may provide it later if you are still preparing your node.
      placeholder: SOBYA account address
    validations:
      required: false
  - type: input
    id: valoper
    attributes:
      label: Validator operator address (if already created)
      description: Leave blank if you have not created the validator yet.
      placeholder: Validator operator address
    validations:
      required: false
  - type: textarea
    id: consensus
    attributes:
      label: Consensus public key (if already available)
      description: Public consensus key only. Never provide a private validator key. You may provide it after node setup.
      placeholder: Public consensus key
    validations:
      required: false
  - type: input
    id: p2p
    attributes:
      label: Public P2P endpoint (if already available)
      description: Host:port reachable by peers. You may provide it after server setup.
      placeholder: host.example:26656
    validations:
      required: false
  - type: input
    id: rpc
    attributes:
      label: Public RPC endpoint (optional)
      description: Read-only public endpoint, if available. Do not include credentials.
      placeholder: https://rpc.example
    validations:
      required: false
  - type: textarea
    id: infrastructure
    attributes:
      label: Server and operations plan
      description: Provider / region, CPU, RAM, storage, bandwidth, Linux distribution, monitoring and backup approach. If not provisioned yet, describe your plan.
      placeholder: Describe your validator infrastructure and 24/7 operations capability.
    validations:
      required: true
  - type: textarea
    id: readiness
    attributes:
      label: Current readiness
      description: State whether your node is planned, being provisioned, syncing, or fully synced.
      placeholder: Current status, experience, and expected preparation timeline.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Required confirmations
      options:
        - label: I understand this is an application, not a guarantee of admission or financial support.
          required: true
        - label: I understand I must synchronize to the live chain and meet verified staking requirements before creating a validator.
          required: true
        - label: I will never share seed phrases, private keys, validator signing keys, or server credentials.
          required: true
        - label: I understand that joining an already-running network uses a live-chain validator creation transaction; a new genesis gentx is not a substitute.
          required: true
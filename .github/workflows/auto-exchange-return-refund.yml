name: SOBYA Auto Exchange USDT refund worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: sobya-auto-exchange-return-refund
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  refund:
    if: github.repository == 'snforem-cpu/sobya-chain' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated exchange dependencies
        working-directory: auto-exchange
        run: npm install --no-audit --no-fund
      - name: Request D1 identity before refund processing
        id: d1-auth-before
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is unavailable}"
          TOKEN_JSON=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sobya-auto-exchange")
          OIDC_TOKEN=$(echo "$TOKEN_JSON" | jq -r .value)
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          echo "::add-mask::$OIDC_TOKEN"
          echo "token=$OIDC_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Import D1 reservations before refund processing
        working-directory: auto-exchange
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GITHUB_OIDC_TOKEN: ${{ steps.d1-auth-before.outputs.token }}
          SOBYA_AUTO_EXCHANGE_API_URL: https://sobya-buy-api.snforem.workers.dev
        run: node d1/sync-d1-quotes.js
      - name: Verify SOBY returns and execute eligible USDT refunds
        working-directory: auto-exchange
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ETHEREUM_RPC_URL: https://ethereum-rpc.publicnode.com
          SOBYA_EVM_RPC_URL: https://sobya-evm-rpc.nodesafe-dapp.xyz
          SOBYA_PAYOUT_PRIVATE_KEY: ${{ secrets.SOBYA_PAYOUT_PRIVATE_KEY }}
        run: node return-worker.js
      - name: Request fresh D1 identity after refund processing
        id: d1-auth-after
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is unavailable}"
          TOKEN_JSON=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sobya-auto-exchange")
          OIDC_TOKEN=$(echo "$TOKEN_JSON" | jq -r .value)
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          echo "::add-mask::$OIDC_TOKEN"
          echo "token=$OIDC_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Synchronize refund results to D1
        working-directory: auto-exchange
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GITHUB_OIDC_TOKEN: ${{ steps.d1-auth-after.outputs.token }}
          SOBYA_AUTO_EXCHANGE_API_URL: https://sobya-buy-api.snforem.workers.dev
        run: node d1/sync-d1-quotes.js

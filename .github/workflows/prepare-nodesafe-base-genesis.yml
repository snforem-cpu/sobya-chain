name: SOBYA NodeSafe Base Genesis Preparation

on:
  push:
    branches:
      - 'launch/genesis-nodesafe-2026-11-09'
    paths:
      - '.github/workflows/prepare-nodesafe-base-genesis.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sobya-nodesafe-base-genesis
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: v0.1.0-rc.2
      SOURCE_COMMIT: 90512106ee2f3c2a38c8f5bab66edc17688fba43
      CHAIN_ID: sobya-1
      EVM_CHAIN_ID: "357812033857"
      GENESIS_TIME: "2026-11-09T10:00:00Z"
      BONYNODE_ACCOUNT: sobya19umw830rw5f5pwgfqk4yz976j5nl3h8h8j5a58
      NODESAFE_ACCOUNT: sobya1qt8da4yt8glv9ehzfl9x248aqulfzhry4yhvh9
      RESERVE_ACCOUNT: sobya1hmh9jk9gmk7k63qrpl3a9vsylcvrp379v3h0kr
      SELF_BOND_ASOByA: "1000000000000000000"
      SOBYA_HOME: ${{ github.workspace }}/.sobya-nodesafe-base
    steps:
      - name: Checkout ceremony branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Checkout exact rc.2 source scripts
        uses: actions/checkout@v4
        with:
          ref: 90512106ee2f3c2a38c8f5bab66edc17688fba43
          path: source

      - name: Download and verify official rc.2 Linux AMD64 binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sobya-bin"
          curl -fL --retry 3 -o "$RUNNER_TEMP/sobyad.tar.gz" "https://github.com/snforem-cpu/sobya-chain/releases/download/${RELEASE_TAG}/sobyad-${RELEASE_TAG}-linux-amd64.tar.gz"
          curl -fL --retry 3 -o "$RUNNER_TEMP/SHA256SUMS" "https://github.com/snforem-cpu/sobya-chain/releases/download/${RELEASE_TAG}/SHA256SUMS"
          grep "sobyad-${RELEASE_TAG}-linux-amd64.tar.gz" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/binary-checksum.txt"
          test -s "$RUNNER_TEMP/binary-checksum.txt"
          (cd "$RUNNER_TEMP" && sha256sum -c binary-checksum.txt)
          tar -xzf "$RUNNER_TEMP/sobyad.tar.gz" -C "$RUNNER_TEMP/sobya-bin"
          test -x "$RUNNER_TEMP/sobya-bin/sobyad"
          "$RUNNER_TEMP/sobya-bin/sobyad" version --long

      - name: Build NodeSafe onboarding base Genesis
        shell: bash
        run: |
          set -euo pipefail
          SOBYAD="$RUNNER_TEMP/sobya-bin/sobyad"
          mkdir -p "$SOBYA_HOME"
          "$SOBYAD" init "SOBYA Public Testnet Rehearsal" --chain-id "$CHAIN_ID" --home "$SOBYA_HOME"

          "$SOBYAD" genesis add-genesis-account sobya16vtfjdprl33xsqu0fm375lqv2qu9z0qc0097pq 400000000000000000000000000asobya --home "$SOBYA_HOME"
          "$SOBYAD" genesis add-genesis-account sobya1zhu55fp76czndk6342vn5e7n7t4q8as08t5yw3 450000000000000000000000000asobya --home "$SOBYA_HOME"
          python3 source/scripts/initialize-production-genesis.py --genesis "$SOBYA_HOME/config/genesis.json"

          "$SOBYAD" genesis add-genesis-account "$BONYNODE_ACCOUNT" "${SELF_BOND_ASOByA}asobya" --home "$SOBYA_HOME"
          "$SOBYAD" genesis add-genesis-account "$NODESAFE_ACCOUNT" "${SELF_BOND_ASOByA}asobya" --home "$SOBYA_HOME"

          python3 - "$SOBYA_HOME/config/genesis.json" "$GENESIS_TIME" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          g=json.loads(p.read_text(encoding="utf-8"))
          g["genesis_time"]=sys.argv[2]
          p.write_text(json.dumps(g, indent=2, sort_keys=True)+"\\n", encoding="utf-8")
          PY

          printf '[{"address":"%s","self_bond_asobya":"%s"},{"address":"%s","self_bond_asobya":"%s"}]\\n' "$BONYNODE_ACCOUNT" "$SELF_BOND_ASOByA" "$NODESAFE_ACCOUNT" "$SELF_BOND_ASOByA" > "$RUNNER_TEMP/validators.json"
          python3 source/scripts/prepare-validator-genesis.py --genesis "$SOBYA_HOME/config/genesis.json" --validators "$RUNNER_TEMP/validators.json"

          sed -i -E 's/^minimum-gas-prices = .*/minimum-gas-prices = "1000000000asobya"/' "$SOBYA_HOME/config/app.toml"
          sed -i -E "s/^evm-chain-id = .*/evm-chain-id = $EVM_CHAIN_ID/" "$SOBYA_HOME/config/app.toml"
          sed -i -E 's|^laddr = "tcp://0.0.0.0:26656"$|laddr = "tcp://0.0.0.0:36656"|' "$SOBYA_HOME/config/config.toml"
          sed -i -E 's|^external_address = ".*"$|external_address = "188.68.36.11:36656"|' "$SOBYA_HOME/config/config.toml"
          sed -i -E 's|^persistent_peers = ".*"$|persistent_peers = ""|' "$SOBYA_HOME/config/config.toml"
          grep -q '^minimum-gas-prices = "1000000000asobya"$' "$SOBYA_HOME/config/app.toml"
          grep -q "^evm-chain-id = $EVM_CHAIN_ID$" "$SOBYA_HOME/config/app.toml"
          grep -q '^laddr = "tcp://0.0.0.0:36656"$' "$SOBYA_HOME/config/config.toml"
          grep -q '^external_address = "188.68.36.11:36656"$' "$SOBYA_HOME/config/config.toml"
          grep -q '^persistent_peers = ""$' "$SOBYA_HOME/config/config.toml"
          grep -Eq "^chain-id = ['\\"]$CHAIN_ID['\\"]$" "$SOBYA_HOME/config/client.toml"

          "$SOBYAD" genesis validate-genesis --home "$SOBYA_HOME"

      - name: Audit NodeSafe base Genesis and supply
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOBYA_HOME/config/genesis.json" "$SOBYA_HOME/config/app.toml" "$SOBYA_HOME/config/config.toml" <<'PY'
          import base64, json, re, sys, tomllib
          from pathlib import Path
          g=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          app=Path(sys.argv[2]).read_text(encoding="utf-8")
          comet=Path(sys.argv[3]).read_text(encoding="utf-8")
          cfg=tomllib.loads(comet)
          assert g["chain_id"]=="sobya-1"
          assert g["genesis_time"]=="2026-11-09T10:00:00Z"
          a=g["app_state"]
          accounts={x["address"]:x for x in a["auth"]["accounts"] if isinstance(x,dict) and "address" in x}
          assert accounts["sobya19umw830rw5f5pwgfqk4yz976j5nl3h8h8j5a58"]["account_number"]=="2"
          assert accounts["sobya1qt8da4yt8glv9ehzfl9x248aqulfzhry4yhvh9"]["account_number"]=="3"
          balances={x["address"]:{c["denom"]:int(c["amount"]) for c in x["coins"]} for x in a["bank"]["balances"]}
          assert balances["sobya16vtfjdprl33xsqu0fm375lqv2qu9z0qc0097pq"]["asobya"]==400_000_000*10**18
          assert balances["sobya1zhu55fp76czndk6342vn5e7n7t4q8as08t5yw3"]["asobya"]==450_000_000*10**18
          assert balances["sobya19umw830rw5f5pwgfqk4yz976j5nl3h8h8j5a58"]["asobya"]==10**18
          assert balances["sobya1qt8da4yt8glv9ehzfl9x248aqulfzhry4yhvh9"]["asobya"]==10**18
          assert balances["sobya1hmh9jk9gmk7k63qrpl3a9vsylcvrp379v3h0kr"]["asobya"]==149_999_998*10**18
          supply={x["denom"]:int(x["amount"]) for x in a["bank"]["supply"]}
          assert supply["asobya"]==1_000_000_000*10**18
          assert a["mint"]["params"]["mint_denom"]=="asobya" and a["mint"]["minter"]["inflation"]=="0"
          assert a["evm"]["params"]["evm_denom"]=="asobya"
          assert a["evm"]["params"]["extended_denom_options"]["extended_denom"]=="asobya"
          assert 'minimum-gas-prices = "1000000000asobya"' in app
          assert re.search(r"^evm-chain-id = 357812033857$", app, re.M)
          assert 'laddr = "tcp://0.0.0.0:36656"' in comet
          assert 'external_address = "188.68.36.11:36656"' in comet
          assert cfg["p2p"]["persistent_peers"]==""
          reserve=a["sobya_validator_reserve"]["entries"][0]["value"]
          meta=json.loads(base64.b64decode(reserve+"="*(-len(reserve)%4)))
          assert meta["total_paid_asobya"]==str(2*10**18)
          assert meta["last_height"]==0
          assert a["genutil"]["gen_txs"]==[]
          print("PASS: NodeSafe account address/checksum and account_number, BonyNode and NodeSafe each funded with 1 SOBY from validator reserve, reserve remainder 149,999,998 SOBY, total supply exactly 1B, chain IDs, denoms, EVM settings, NodeSafe P2P settings, and no gentx prematurely collected.")
          PY

      - name: Assemble NodeSafe onboarding package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sobya-nodesafe-base"
          mkdir -p "$OUT"
          cp "$SOBYA_HOME/config/genesis.json" "$OUT/genesis.json"
          cp "$SOBYA_HOME/config/app.toml" "$OUT/app.toml"
          cp "$SOBYA_HOME/config/client.toml" "$OUT/client.toml"
          cp "$SOBYA_HOME/config/config.toml" "$OUT/config.toml"
          cat > "$OUT/ONBOARDING-MANIFEST.txt" <<EOF
          SOBYA — NODESAFE GENESIS ONBOARDING BASE (NOT FINAL GENESIS)
          Release: v0.1.0-rc.2
          Source commit: $SOURCE_COMMIT
          CometBFT chain ID: $CHAIN_ID
          EVM chain ID: $EVM_CHAIN_ID
          Genesis time currently set to: $GENESIS_TIME
          Purpose: NodeSafe to initialize locally and generate its own signed gentx.
          NodeSafe account: $NODESAFE_ACCOUNT
          NodeSafe self-bond: 1 SOBY (1000000000000000000 asobya), allocated from validator reserve; NodeSafe pays nothing.
          BonyNode account: $BONYNODE_ACCOUNT
          BonyNode self-bond: 1 SOBY (already allocated from validator reserve).
          Validator reserve after both symbolic self-bonds: 149,999,998 SOBY.
          NodeSafe P2P endpoint: 188.68.36.11:36656
          NodeSafe CometBFT listen: tcp://0.0.0.0:36656
          NodeSafe external_address: 188.68.36.11:36656
          Persistent peers: empty in this signing base; coordinator will provide peer settings after Node IDs are confirmed.
          Native supply: exactly 1,000,000,000 SOBY; base denomination asobya; precision 18.
          This is an onboarding/signing base only. It is NOT the final collected Genesis and must NOT be used to start the network.
          No gentx is included in this base. Generate and sign the NodeSafe gentx locally against this exact chain ID and Genesis, then return only the signed gentx JSON.
          Keep priv_validator_key.json and node_key.json private; never send either file.
          The final Genesis will be rebuilt after all participating validators' signed gentx files are collected and verified.
          EOF
          (cd "$OUT" && sha256sum genesis.json app.toml client.toml config.toml ONBOARDING-MANIFEST.txt > SHA256SUMS)
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/sobya-nodesafe-base-genesis.zip" sobya-nodesafe-base)

      - name: Upload NodeSafe onboarding package
        uses: actions/upload-artifact@v4
        with:
          name: sobya-nodesafe-base-genesis
          path: ${{ github.workspace }}/sobya-nodesafe-base-genesis.zip
          if-no-files-found: error
          retention-days: 30

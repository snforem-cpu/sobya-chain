name: SOBYA Final BonyNode Genesis Ceremony (P2P aligned)

on:
  push:
    branches:
      - 'launch/genesis-bonynode-2026-11-09'
    paths:
      - '.github/workflows/finalize-bonynode-genesis-p2p.yml'
      - 'gentxs/bonynode/SOBYA-gentx-BonyNode-2026-11-08-corrected.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sobya-final-genesis-bonynode
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: v0.1.0-rc.2
      SOURCE_COMMIT: 90512106ee2f3c2a38c8f5bab66edc17688fba43
      CHAIN_ID: sobya-1
      EVM_CHAIN_ID: "357812033857"
      GENESIS_TIME: "2026-11-09T08:00:00Z"
      BONYNODE_ACCOUNT: sobya19umw830rw5f5pwgfqk4yz976j5nl3h8h8j5a58
      BONYNODE_OPERATOR: sobyavaloper19umw830rw5f5pwgfqk4yz976j5nl3h8ha3ddjl
      BONYNODE_NODE_ID: b1e9672699b077da1aeb4620c08776061251aeb7
      BONYNODE_P2P: 88.198.46.55:42656
      SELF_BOND_ASOByA: "1000000000000000000"
      SOBYA_HOME: ${{ github.workspace }}/.sobya-final-genesis
      GENTX_PATH: gentxs/bonynode/SOBYA-gentx-BonyNode-2026-11-08-corrected.json
    steps:
      - name: Checkout ceremony branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Checkout exact rc.2 source and genesis scripts
        uses: actions/checkout@v4
        with:
          ref: 90512106ee2f3c2a38c8f5bab66edc17688fba43
          path: source

      - name: Verify signed Gentx file hash
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_GENTX_SHA="e56af363dfb7f5e4b6012671b927d63b2aa309f79a96639dfcbc9cee6866e583"
          echo "BonyNode email-supplied attachment SHA-256 (reference): $EXPECTED_GENTX_SHA"
          echo "SHA-256 of repository-staged JSON copy:"
          sha256sum "$GENTX_PATH" | tee "$RUNNER_TEMP/staged-gentx.sha256"
          echo "The staged JSON is checked semantically and its Cosmos signature is checked by collect-gentxs; byte-for-byte attachment checksum equality is not asserted."
          python3 - "$GENTX_PATH" <<'PY'
          import json, sys
          g=json.load(open(sys.argv[1], encoding="utf-8"))
          msg=g["body"]["messages"]
          assert len(msg)==1
          m=msg[0]
          assert m["@type"]=="/cosmos.staking.v1beta1.MsgCreateValidator"
          assert m["description"]["moniker"]=="BonyNode"
          assert m["delegator_address"]=="sobya19umw830rw5f5pwgfqk4yz976j5nl3h8h8j5a58"
          assert m["value"]=={"denom":"asobya","amount":"1000000000000000000"}
          assert m["commission"]["rate"]=="0.050000000000000000"
          assert g["body"]["memo"]=="b1e9672699b077da1aeb4620c08776061251aeb7@88.198.46.55:42656"
          assert len(g["signatures"])==1 and g["signatures"][0]
          print("PASS: exact BonyNode signed Gentx fields and supplied SHA-256")
          PY

      - name: Download and verify official rc.2 Linux AMD64 binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sobya-bin"
          curl -fL --retry 3 -o "$RUNNER_TEMP/sobyad-${RELEASE_TAG}-linux-amd64.tar.gz" "https://github.com/snforem-cpu/sobya-chain/releases/download/${RELEASE_TAG}/sobyad-${RELEASE_TAG}-linux-amd64.tar.gz"
          curl -fL --retry 3 -o "$RUNNER_TEMP/SHA256SUMS" "https://github.com/snforem-cpu/sobya-chain/releases/download/${RELEASE_TAG}/SHA256SUMS"
          grep "sobyad-${RELEASE_TAG}-linux-amd64.tar.gz" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/binary-checksum.txt"
          test -s "$RUNNER_TEMP/binary-checksum.txt"
          (cd "$RUNNER_TEMP" && sha256sum -c binary-checksum.txt)
          tar -xzf "$RUNNER_TEMP/sobyad-${RELEASE_TAG}-linux-amd64.tar.gz" -C "$RUNNER_TEMP/sobya-bin"
          test -x "$RUNNER_TEMP/sobya-bin/sobyad"
          "$RUNNER_TEMP/sobya-bin/sobyad" version --long

      - name: Build canonical genesis with BonyNode self-bond
        shell: bash
        run: |
          set -euo pipefail
          SOBYAD="$RUNNER_TEMP/sobya-bin/sobyad"
          mkdir -p "$SOBYA_HOME"
          "$SOBYAD" init "SOBYA Public Testnet Rehearsal" --chain-id "$CHAIN_ID" --home "$SOBYA_HOME"

          "$SOBYAD" genesis add-genesis-account sobya16vtfjdprl33xsqu0fm375lqv2qu9z0qc0097pq 400000000000000000000000000asobya --home "$SOBYA_HOME"
          "$SOBYAD" genesis add-genesis-account sobya1zhu55fp76czndk6342vn5e7n7t4q8as08t5yw3 450000000000000000000000000asobya --home "$SOBYA_HOME"
          python3 source/scripts/initialize-production-genesis.py --genesis "$SOBYA_HOME/config/genesis.json"

          "$SOBYAD" genesis add-genesis-account "$BONYNODE_ACCOUNT" "${SELF_BOND_ASOByA}asobya" --home "$SOBYA_HOME"
          printf '[{"address":"%s","self_bond_asobya":"%s"}]\n' "$BONYNODE_ACCOUNT" "$SELF_BOND_ASOByA" > "$RUNNER_TEMP/validators.json"

          python3 - "$SOBYA_HOME/config/genesis.json" "$GENESIS_TIME" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          g=json.loads(p.read_text(encoding="utf-8"))
          g["genesis_time"]=sys.argv[2]
          p.write_text(json.dumps(g, indent=2, sort_keys=True)+"\n", encoding="utf-8")
          PY

          python3 source/scripts/prepare-validator-genesis.py --genesis "$SOBYA_HOME/config/genesis.json" --validators "$RUNNER_TEMP/validators.json"

          sed -i -E 's/^minimum-gas-prices = .*/minimum-gas-prices = "1000000000asobya"/' "$SOBYA_HOME/config/app.toml"
          sed -i -E "s/^evm-chain-id = .*/evm-chain-id = $EVM_CHAIN_ID/" "$SOBYA_HOME/config/app.toml"
          sed -i -E 's|^laddr = "tcp://0.0.0.0:26656"$|laddr = "tcp://0.0.0.0:42656"|' "$SOBYA_HOME/config/config.toml"
          sed -i -E 's|^external_address = ".*"$|external_address = "88.198.46.55:42656"|' "$SOBYA_HOME/config/config.toml"
          sed -i -E 's|^persistent_peers = ".*"$|persistent_peers = ""|' "$SOBYA_HOME/config/config.toml"
          grep -q '^minimum-gas-prices = "1000000000asobya"$' "$SOBYA_HOME/config/app.toml"
          grep -q "^evm-chain-id = $EVM_CHAIN_ID$" "$SOBYA_HOME/config/app.toml"
          grep -q '^laddr = "tcp://0.0.0.0:42656"$' "$SOBYA_HOME/config/config.toml"
          grep -q '^external_address = "88.198.46.55:42656"$' "$SOBYA_HOME/config/config.toml"
          grep -q '^persistent_peers = ""$' "$SOBYA_HOME/config/config.toml"
          grep -Eq "^chain-id = ['\"]$CHAIN_ID['\"]$" "$SOBYA_HOME/config/client.toml"

          mkdir -p "$SOBYA_HOME/config/gentx"
          cp "$GENTX_PATH" "$SOBYA_HOME/config/gentx/bonynode.json"
          "$SOBYAD" genesis collect-gentxs --home "$SOBYA_HOME"
          "$SOBYAD" genesis validate-genesis --home "$SOBYA_HOME"

          # Re-apply operator-specific P2P values after CLI genesis commands.
          sed -i -E 's|^laddr = "tcp://0.0.0.0:26656"$|laddr = "tcp://0.0.0.0:42656"|' "$SOBYA_HOME/config/config.toml"
          sed -i -E 's|^external_address = ".*"$|external_address = "88.198.46.55:42656"|' "$SOBYA_HOME/config/config.toml"
          sed -i -E 's|^persistent_peers = ".*"$|persistent_peers = ""|' "$SOBYA_HOME/config/config.toml"
          grep -q '^laddr = "tcp://0.0.0.0:42656"$' "$SOBYA_HOME/config/config.toml"
          grep -q '^external_address = "88.198.46.55:42656"$' "$SOBYA_HOME/config/config.toml"
          grep -q '^persistent_peers = ""$' "$SOBYA_HOME/config/config.toml"
          grep -nE '^(laddr|external_address|persistent_peers) =' "$SOBYA_HOME/config/config.toml"

      - name: Independently reconcile final Genesis and validator set
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOBYA_HOME/config/genesis.json" "$SOBYA_HOME/config/app.toml" "$SOBYA_HOME/config/config.toml" <<'PY'
          import base64, json, re, sys, tomllib
          from pathlib import Path
          g=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          app=Path(sys.argv[2]).read_text(encoding="utf-8")
          comet=Path(sys.argv[3]).read_text(encoding="utf-8")
          comet_config=tomllib.loads(comet)
          assert g["chain_id"]=="sobya-1", g["chain_id"]
          assert g["genesis_time"]=="2026-11-09T08:00:00Z", g["genesis_time"]
          a=g["app_state"]
          balances={x["address"]:{c["denom"]:int(c["amount"]) for c in x["coins"]} for x in a["bank"]["balances"]}
          assert balances["sobya16vtfjdprl33xsqu0fm375lqv2qu9z0qc0097pq"]["asobya"]==400_000_000*10**18
          assert balances["sobya1zhu55fp76czndk6342vn5e7n7t4q8as08t5yw3"]["asobya"]==450_000_000*10**18
          assert balances["sobya19umw830rw5f5pwgfqk4yz976j5nl3h8h8j5a58"]["asobya"]==10**18
          assert balances["sobya1hmh9jk9gmk7k63qrpl3a9vsylcvrp379v3h0kr"]["asobya"]==149_999_999*10**18
          supply={x["denom"]:int(x["amount"]) for x in a["bank"]["supply"]}
          assert supply["asobya"]==1_000_000_000*10**18, supply
          assert a["mint"]["params"]["mint_denom"]=="asobya"
          assert a["mint"]["minter"]["inflation"]=="0"
          assert a["evm"]["params"]["evm_denom"]=="asobya"
          assert a["evm"]["params"]["extended_denom_options"]["extended_denom"]=="asobya"
          assert 'minimum-gas-prices = "1000000000asobya"' in app
          assert re.search(r"^evm-chain-id = 357812033857$", app, re.M)
          assert 'laddr = "tcp://0.0.0.0:42656"' in comet
          assert 'external_address = "88.198.46.55:42656"' in comet
          assert comet_config["p2p"]["persistent_peers"] == ""
          gentxs=a["genutil"]["gen_txs"]
          assert len(gentxs)==1, len(gentxs)
          tx=json.loads(gentxs[0]) if isinstance(gentxs[0], str) else gentxs[0]
          msgs=tx["body"]["messages"]
          assert len(msgs)==1
          m=msgs[0]
          assert m["@type"]=="/cosmos.staking.v1beta1.MsgCreateValidator"
          assert m["delegator_address"]=="sobya19umw830rw5f5pwgfqk4yz976j5nl3h8h8j5a58"
          assert m["validator_address"]=="sobyavaloper19umw830rw5f5pwgfqk4yz976j5nl3h8ha3ddjl"
          assert m["description"]["moniker"]=="BonyNode"
          assert m["commission"]["rate"]=="0.050000000000000000"
          assert m["value"]=={"denom":"asobya","amount":"1000000000000000000"}
          assert tx["body"]["memo"]=="b1e9672699b077da1aeb4620c08776061251aeb7@88.198.46.55:42656"
          extension=a["sobya_validator_reserve"]["entries"][0]["value"]
          meta=json.loads(base64.b64decode(extension+"="*(-len(extension)%4)))
          assert meta["total_paid_asobya"]==str(10**18)
          assert meta["start_time"]=="2026-11-09T08:00:00.000000Z", meta
          print("PASS: final chain IDs, 10:00 Sudan genesis time, BonyNode validator and delegation, 5% commission, 1 SOBY self-bond, 149,999,999 SOBY remaining reserve, exact 1B SOBY supply, canonical denoms and gas settings")
          PY

      - name: Assemble immutable operator bundle and checksums
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sobya-final-bundle"
          mkdir -p "$OUT"
          cp "$SOBYA_HOME/config/genesis.json" "$OUT/genesis.json"
          cp "$SOBYA_HOME/config/app.toml" "$OUT/app.toml"
          cp "$SOBYA_HOME/config/client.toml" "$OUT/client.toml"
          cp "$SOBYA_HOME/config/config.toml" "$OUT/config.toml"
          cp "$GENTX_PATH" "$OUT/bonynode-gentx.json"
          cat > "$OUT/LAUNCH-MANIFEST.txt" <<EOF
          SOBYA PUBLIC TESTNET REHEARSAL — FINAL GENESIS CANDIDATE
          Release: v0.1.0-rc.2
          Source commit: $SOURCE_COMMIT
          CometBFT chain ID: $CHAIN_ID
          EVM chain ID: $EVM_CHAIN_ID
          Genesis time: $GENESIS_TIME (10:00 Sudan time, UTC+2)
          Validator count in genesis: 1
          Validator: BonyNode
          Operator account: $BONYNODE_ACCOUNT
          Operator address: $BONYNODE_OPERATOR
          Node ID: $BONYNODE_NODE_ID
          Public P2P endpoint: $BONYNODE_P2P
          CometBFT P2P listen: tcp://0.0.0.0:42656
          CometBFT external_address: 88.198.46.55:42656
          Persistent peers: empty for initial single-validator rehearsal; do not peer to self
          Initial self-bond: 1 SOBY (1000000000000000000 asobya), from the 150M validator reserve
          Remaining validator reserve: 149,999,999 SOBY
          BonyNode email Gentx checksum reference: e56af363dfb7f5e4b6012671b927d63b2aa309f79a96639dfcbc9cee6866e583
          Note: repository JSON copy is semantically checked; its bytewise SHA-256 is separately recorded in SHA256SUMS, because exact byte equality with the email attachment was not established.
          Native supply: exactly 1,000,000,000 SOBY
          Base denomination: asobya; precision: 18
          Status: genesis collected and validated. Network startup is NOT yet confirmed.
          Operator must preserve their own priv_validator_key.json and node_key.json; never upload or share either file.
          Do not start before confirming this exact Genesis SHA-256 with the coordinator and synchronizing the launch.
          EOF
          (cd "$OUT" && sha256sum genesis.json app.toml client.toml config.toml bonynode-gentx.json LAUNCH-MANIFEST.txt > SHA256SUMS)
          tar -czf "$GITHUB_WORKSPACE/sobya-final-genesis-bonynode.tar.gz" -C "$OUT" .
          (cd "$GITHUB_WORKSPACE" && sha256sum sobya-final-genesis-bonynode.tar.gz > sobya-final-genesis-bonynode.tar.gz.sha256)
          sha256sum "$OUT/genesis.json" > "$GITHUB_WORKSPACE/sobya-final-genesis.json.sha256"

      - name: Publish immutable launch files on the ceremony branch
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/genesis/launch-2026-11-09"
          mkdir -p "$DEST"
          OUT="$RUNNER_TEMP/sobya-final-bundle"
          cp "$OUT/genesis.json" "$OUT/app.toml" "$OUT/client.toml" "$OUT/config.toml" "$OUT/bonynode-gentx.json" "$OUT/LAUNCH-MANIFEST.txt" "$OUT/SHA256SUMS" "$DEST/"
          cp "$GITHUB_WORKSPACE/sobya-final-genesis-bonynode.tar.gz" "$DEST/"
          cp "$GITHUB_WORKSPACE/sobya-final-genesis-bonynode.tar.gz.sha256" "$DEST/"
          cp "$GITHUB_WORKSPACE/sobya-final-genesis.json.sha256" "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "genesis: publish BonyNode testnet genesis candidate for 2026-11-09"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload final Genesis package
        uses: actions/upload-artifact@v4
        with:
          name: sobya-final-genesis-bonynode-2026-11-09
          path: |
            ${{ github.workspace }}/sobya-final-genesis-bonynode.tar.gz
            ${{ github.workspace }}/sobya-final-genesis-bonynode.tar.gz.sha256
            ${{ github.workspace }}/sobya-final-genesis.json.sha256
          if-no-files-found: error
          retention-days: 30

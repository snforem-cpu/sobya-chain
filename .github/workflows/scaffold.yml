
name: SOBYA Blockchain Scaffold

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Ignite CLI
        run: |
          curl -fsSL https://get.ignite.com/cli! | bash
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Verify Ignite installation
        run: |
          ignite version

      - name: Generate SOBYA chain
        run: |
          ignite cosmos scaffold chain sobya \
            --address-prefix sobya \
            --no-module \
            --skip-git

      - name: Check generated files
        run: |
          echo "Checking generated SOBYA files..."
          if [ ! -d sobya ]; then
            echo "ERROR: SOBYA directory was not created."
            exit 1
          fi
          find sobya -maxdepth 2 -type f | sort
          test -f sobya/go.mod

      - name: Build SOBYA chain
        run: |
          cd sobya
          go mod tidy
          go build ./...

      - name: Upload SOBYA source
        uses: actions/upload-artifact@v4
        with:
          name: sobya-chain-source
          path: sobya/
          if-no-files-found: error
          retention-days: 7

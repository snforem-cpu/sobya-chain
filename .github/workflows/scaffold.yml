
name: SOBYA Blockchain Scaffold

on:
  workflow_dispatch:

jobs:
  create-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Ignite CLI v30
        run: |
          curl https://get.ignite.com/cli! | bash
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Verify Ignite
        run: |
          ignite version

      - name: Generate SOBYA chain
        run: |
          ignite cosmos scaffold chain sobya \
            --address-prefix sobya \
            --no-module \
            --skip-git

      - name: Build SOBYA chain
        run: |
          cd sobya
          go mod tidy
          go build ./...

      - name: Save generated chain
        uses: actions/upload-artifact@v4
        with:
          name: sobya-chain-source
          path: sobya/
          retention-days: 7


name: SOBYA Blockchain Scaffold

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-chain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: false

      - name: Install pinned Ignite v29.10.1
        run: |
          git clone --depth 1 --branch v29.10.1 https://github.com/ignite/cli.git ignite-cli
          cd ignite-cli
          make install
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Verify installed tools
        run: |
          which ignite
          ignite version
          go version

      - name: Generate SOBYA chain
        run: |
          ignite scaffold chain sobya \
            --address-prefix sobya \
            --no-module \
            --skip-git

      - name: Verify generated source
        run: |
          test -d sobya
          test -f sobya/go.mod
          echo "SOBYA source files generated successfully."
          find sobya -maxdepth 2 -type f | sort

      - name: Build SOBYA chain
        working-directory: sobya
        run: |
          go mod tidy
          go build ./...

      - name: Upload SOBYA source
        uses: actions/upload-artifact@v4
        with:
          name: sobya-chain-source
          path: sobya/
          if-no-files-found: error
          retention-days: 7

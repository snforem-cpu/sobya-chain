name: SOBYA Network Configuration Validation

on:
  push:
    branches:
      - 'feature/**'
      - 'release/**'
    paths:
      - 'scripts/validate-network-config.py'
      - 'scripts/prepare-validator-genesis.py'
      - 'scripts/initialize-production-genesis.py'
      - 'scripts/probe-public-network.sh'
      - 'scripts/package-release.sh'
      - 'docs/testnet/NETWORK_CONNECTIVITY_STAGE_TWO.md'
      - 'docs/STAGE_THREE_OPERATOR_KIT.md'
      - 'docs/GENESIS_CEREMONY.md'
      - 'docs/PRODUCTION_GENESIS_PREPARATION.md'
      - 'docs/RELEASE_PROCESS.md'
      - 'docs/ANNOUNCEMENTS.md'
      - 'docs/VALIDATOR_RECRUITMENT.md'
      - 'docs/testnet/validator-operator.md'
      - 'sobya/cmd/sobyad/cmd/config.go'
      - 'sobya/cmd/sobyad/cmd/config_test.go'
      - '.github/workflows/feature-network-config-validation.yml'
      - '.github/workflows/validator-binary-release.yml'
      - '.github/workflows/feature-production-genesis-preflight.yml'
  pull_request:
    paths:
      - 'scripts/validate-network-config.py'
      - 'scripts/prepare-validator-genesis.py'
      - 'scripts/probe-public-network.sh'
      - 'scripts/package-release.sh'
      - 'docs/testnet/NETWORK_CONNECTIVITY_STAGE_TWO.md'
      - 'docs/STAGE_THREE_OPERATOR_KIT.md'
      - 'docs/GENESIS_CEREMONY.md'
      - 'docs/RELEASE_PROCESS.md'
      - 'docs/ANNOUNCEMENTS.md'
      - 'docs/VALIDATOR_RECRUITMENT.md'
      - 'docs/testnet/validator-operator.md'
      - 'sobya/cmd/sobyad/cmd/config.go'
      - 'sobya/cmd/sobyad/cmd/config_test.go'
      - '.github/workflows/feature-network-config-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sobya-network-config-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  network-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse all GitHub Actions workflow YAML files
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").sort.each { |path| YAML.load_file(path, aliases: true); puts "PASS #{path}" }'

      - name: Compile and self-test network config auditor
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate-network-config.py
          python scripts/validate-network-config.py --self-test
          python -m py_compile scripts/prepare-validator-genesis.py
          python scripts/prepare-validator-genesis.py --self-test
          python -m py_compile scripts/initialize-production-genesis.py
          python scripts/initialize-production-genesis.py --self-test
          bash -n scripts/probe-public-network.sh
          bash -n scripts/package-release.sh

      - name: Check stage-three deliverables exist
        run: |
          set -euo pipefail
          test -s docs/STAGE_THREE_OPERATOR_KIT.md
          test -s docs/GENESIS_CEREMONY.md
          test -s scripts/prepare-validator-genesis.py
          test -s scripts/initialize-production-genesis.py
          test -s docs/RELEASE_PROCESS.md
          test -s docs/ANNOUNCEMENTS.md
          grep -qi '150M SOBY lifetime allocation' docs/STAGE_THREE_OPERATOR_KIT.md
          grep -qi '95% signing eligibility' docs/STAGE_THREE_OPERATOR_KIT.md
          grep -q '777777' docs/GENESIS_CEREMONY.md

      - name: Run focused Go CLI configuration tests
        working-directory: sobya
        run: |
          set -euo pipefail
          go test -mod=readonly ./cmd/sobyad/cmd
          go build -mod=readonly -trimpath \
            -ldflags "-X github.com/cosmos/cosmos-sdk/version.Name=sobya -X github.com/cosmos/cosmos-sdk/version.AppName=sobyad -X github.com/cosmos/cosmos-sdk/version.Version=ci -X github.com/cosmos/cosmos-sdk/version.Commit=${GITHUB_SHA}" \
            -o /tmp/sobyad ./cmd/sobyad
          /tmp/sobyad version

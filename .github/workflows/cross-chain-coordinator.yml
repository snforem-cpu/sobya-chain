name: Cross-chain coordinator ledger and pricing tests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "cross-chain/coordinator/**"
      - "cross-chain/custodial/**"
      - "cross-chain/CUSTODIAL_INVENTORY_SWAP.md"
      - "cross-chain/observer/source_observer_router.py"
      - "cross-chain/observer/destination_payout_router.py"
      - "cross-chain/observer/test_observer_routers.py"
      - ".github/workflows/cross-chain-coordinator.yml"
  push:
    branches:
      - main
      - feat/sobya-cross-chain-swap-foundation
    paths:
      - "cross-chain/coordinator/**"
      - "cross-chain/custodial/**"
      - "cross-chain/CUSTODIAL_INVENTORY_SWAP.md"
      - "cross-chain/observer/source_observer_router.py"
      - "cross-chain/observer/destination_payout_router.py"
      - "cross-chain/observer/test_observer_routers.py"
      - ".github/workflows/cross-chain-coordinator.yml"

permissions:
  contents: read

jobs:
  coordinator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Keccak dependency
        run: python -m pip install -r cross-chain/observer/requirements.txt
      - name: Run durable order ledger and pricing tests
        working-directory: cross-chain/coordinator
        run: |
          python -m pip install "eth-hash[pycryptodome]==0.7.1"
          python -m unittest discover -s . -p 'test_*.py' -v
          cd ../observer
          python -m unittest -v test_observer_routers.py
          cd ../custodial
          python -m unittest -v test_custodial_ledger.py
          python -m unittest -v test_demand_pricing.py
          python -m unittest -v test_evm_deposit_watcher.py

name: SOBYA Project Verification

on:
  workflow_dispatch:
  push:
    branches:
      - maintenance/verify-build

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          mkdir -p project
          unzip -q 26031 -d project
          test -f project/go.mod
          test -f project/cmd/sobyad/main.go

      - name: Inspect original denomination settings (read-only)
        run: |
          echo '--- Relevant source/config files ---'
          find project -type f \\( -name '*.go' -o -name '*.yml' -o -name '*.yaml' -o -name '*.json' -o -name '*.toml' \\) \\
            -not -path '*/vendor/*' -not -path '*/.git/*' | sort
          echo '--- Denomination and project-name references in original archive ---'
          grep -RInE 'DefaultBondDenom|BondDenom|default_denom|bond_denom|stake|usobya|SOBY|SOBYA' project \\
            --include='*.go' --include='*.yml' --include='*.yaml' --include='*.json' --include='*.toml' \\
            --exclude-dir=vendor --exclude-dir=.git || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: project/go.mod
          cache: true
          cache-dependency-path: project/go.sum

      - name: Verify dependencies
        working-directory: project
        run: go mod verify

      - name: Run tests
        working-directory: project
        run: go test -mod=readonly ./...

      - name: Build node binary
        working-directory: project
        run: go build -mod=readonly -o ../sobyad ./cmd/sobyad

      - name: Report binary
        run: file sobyad

name: Cross-chain settlement observer tests

on:
  pull_request:
    paths:
      - "cross-chain/observer/**"
      - "cross-chain/coordinator/**"
      - ".github/workflows/cross-chain-observer.yml"
  push:
    branches:
      - main
      - feat/sobya-cross-chain-swap-foundation
    paths:
      - "cross-chain/observer/**"
      - ".github/workflows/cross-chain-observer.yml"

permissions:
  contents: read

jobs:
  observer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned observer dependency
        run: python -m pip install -r cross-chain/observer/requirements.txt
      - name: Run all observer tests
        working-directory: cross-chain/observer
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Run cross-chain coordinator tests
        working-directory: cross-chain/coordinator
        run: python -m unittest discover -s . -p 'test_*.py' -v

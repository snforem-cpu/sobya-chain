name: Deploy SOBYA BUY API

on:
  push:
    branches:
      - main
      - feature/sobya-buy-portal
      - feature/sobya-buy-manual-payout
    paths:
      - 'buy-api/**'
      - '.github/workflows/deploy-sobya-buy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sobya-buy-api-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buy-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run API and pricing tests
        run: npm test

      - name: Apply production D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply sobya-buy-db --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy fail-closed API Worker
        run: npx --yes wrangler@4 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


name: Restore SOBYA Source

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download successful SOBYA artifact
        uses: actions/download-artifact@v4
        with:
          name: sobya-chain-source
          run-id: 41024895649
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: ./sobya-download

      - name: Verify and restore source
        run: |
          if [ -e sobya ]; then
            echo "The sobya directory already exists. Stopping to protect existing files."
            exit 1
          fi

          test -f sobya-download/go.mod

          mkdir -p sobya
          cp -a sobya-download/. sobya/

          test -f sobya/go.mod
          echo "SOBYA source restored successfully."

      - name: Commit source to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sobya/
          git commit -m "Restore generated SOBYA blockchain source"
          git push

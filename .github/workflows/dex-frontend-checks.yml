name: SOBYA DEX frontend safety checks

on:
  pull_request:
    paths:
      - "dex/**"
      - ".github/workflows/dex-frontend-checks.yml"
  push:
    branches: [main]
    paths:
      - "dex/**"
      - ".github/workflows/dex-frontend-checks.yml"

permissions:
  contents: read

jobs:
  config-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SOBYA DEX configuration and deployment gate
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('dex/config.json', 'utf8'));
          const html = fs.readFileSync('dex/index.html', 'utf8');
          const deploy = fs.readFileSync('dex/deploy/index.html', 'utf8');
          if (config.chainId !== 357812033857) throw new Error('Unexpected EVM chain ID');
          if (config.chainName !== 'SOBYA Mainnet') throw new Error('Unexpected network name');
          if (config.deploymentStatus !== 'verified') throw new Error('Mainnet deployment must be marked verified only after receipt and bytecode verification');
          if (config.liquidityEnabled !== true) throw new Error('Initial liquidity operations must remain explicitly enabled');
          if (config.tradingEnabled !== true) throw new Error('Owner-authorized mainnet swap testing must remain explicitly enabled in the published DEX config');
          for (const key of ['factory', 'router', 'wrappedSoby', 'oracle']) {
            if (!/^0x[0-9a-fA-F]{40}$/.test(config[key] || '')) {
              throw new Error(`Missing or malformed recorded deployment address: ${key}`);
            }
          }
          if (!html.includes("config.deploymentStatus==='verified'") || !html.includes('config.liquidityEnabled===true') || !html.includes('config.tradingEnabled===true')) {
            throw new Error('Wallet transaction controls must require verified deployment and explicit liquidity/trading gates');
          }
          if (!html.includes('CHAIN_ID=357812033857n')) throw new Error('Wallet chain guard missing');
          if (!deploy.includes('const DEPLOYMENT_LOCKED = false')) throw new Error('Mobile deployer must be enabled after independent audit and live integration');
          if (!deploy.includes('if(DEPLOYMENT_LOCKED){')) throw new Error('Mobile deploy handler does not enforce the deployment lock');
          if (!deploy.includes('id="verifyMainnet"') || !deploy.includes('async function verifyMainnetDeployments()')) {
            throw new Error('Read-only mainnet deployment verifier is missing');
          }
          if (!deploy.includes('MAINNET_DEPLOYMENTS')) throw new Error('Recorded mainnet deployment set is missing');
          if (!deploy.includes('Read-only checks passed')) throw new Error('Verifier success report is missing');
          if (!deploy.includes('Deploy SOBYA DEX contracts')) throw new Error('Mobile deploy button label is missing');
          console.log('Verified mainnet deployments are recorded; owner-authorized swap testing and initial liquidity are enabled.');
          NODE

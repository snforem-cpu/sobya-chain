name: Prepare SOBYA BonyNode pre-gentx Genesis

on:
  push:
    branches:
      - 'feature/genesis-bonynode-candidate'
    paths:
      - '.github/workflows/prepare-bonynode-genesis.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sobya-bonynode-pregenesis
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: v0.1.0-rc.2
      CHAIN_ID: sobya-1
      EVM_CHAIN_ID: "357812033857"
      GENESIS_TIME: "2026-11-09T19:32:00Z"
      BONYNODE_ACCOUNT: sobya19umw830rw5f5pwgfqk4yz976j5nl3h8h8j5a58
      SELF_BOND_ASOByA: "1000000000000000000"
      SOBYA_HOME: ${{ github.workspace }}/.sobya-bonynode-genesis
    steps:
      - name: Checkout reviewed rc.2 source and genesis scripts
        uses: actions/checkout@v4
        with:
          ref: 90512106ee2f3c2a38c8f5bab66edc17688fba43

      - name: Download and verify official rc.2 Linux AMD64 binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sobya-bin"
          curl -fL --retry 3 -o "$RUNNER_TEMP/sobyad.tar.gz" "https://github.com/snforem-cpu/sobya-chain/releases/download/${RELEASE_TAG}/sobyad-${RELEASE_TAG}-linux-amd64.tar.gz"
          curl -fL --retry 3 -o "$RUNNER_TEMP/SHA256SUMS" "https://github.com/snforem-cpu/sobya-chain/releases/download/${RELEASE_TAG}/SHA256SUMS"
          grep "sobyad-${RELEASE_TAG}-linux-amd64.tar.gz" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/binary-checksum.txt"
          test -s "$RUNNER_TEMP/binary-checksum.txt"
          (cd "$RUNNER_TEMP" && sha256sum -c binary-checksum.txt)
          tar -xzf "$RUNNER_TEMP/sobyad.tar.gz" -C "$RUNNER_TEMP/sobya-bin"
          test -x "$RUNNER_TEMP/sobya-bin/sobyad"
          "$RUNNER_TEMP/sobya-bin/sobyad" version --long

      - name: Initialize production-ID genesis and apply approved allocations
        shell: bash
        run: |
          set -euo pipefail
          SOBYAD="$RUNNER_TEMP/sobya-bin/sobyad"
          mkdir -p "$SOBYA_HOME"
          "$SOBYAD" init "SOBYA BonyNode genesis candidate" --chain-id "$CHAIN_ID" --home "$SOBYA_HOME"

          "$SOBYAD" genesis add-genesis-account sobya16vtfjdprl33xsqu0fm375lqv2qu9z0qc0097pq 400000000000000000000000000asobya --home "$SOBYA_HOME"
          "$SOBYAD" genesis add-genesis-account sobya1zhu55fp76czndk6342vn5e7n7t4q8as08t5yw3 450000000000000000000000000asobya --home "$SOBYA_HOME"
          python3 scripts/initialize-production-genesis.py --genesis "$SOBYA_HOME/config/genesis.json"

          "$SOBYAD" genesis add-genesis-account "$BONYNODE_ACCOUNT" "${SELF_BOND_ASOByA}asobya" --home "$SOBYA_HOME"
          printf '[{"address":"%s","self_bond_asobya":"%s"}]\n' "$BONYNODE_ACCOUNT" "$SELF_BOND_ASOByA" > "$RUNNER_TEMP/validators.json"

          python3 - "$SOBYA_HOME/config/genesis.json" "$GENESIS_TIME" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          data = json.loads(p.read_text(encoding="utf-8"))
          data["genesis_time"] = sys.argv[2]
          p.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          python3 scripts/prepare-validator-genesis.py --genesis "$SOBYA_HOME/config/genesis.json" --validators "$RUNNER_TEMP/validators.json"

          sed -i -E 's/^minimum-gas-prices = .*/minimum-gas-prices = "1000000000asobya"/' "$SOBYA_HOME/config/app.toml"
          sed -i -E "s/^evm-chain-id = .*/evm-chain-id = $EVM_CHAIN_ID/" "$SOBYA_HOME/config/app.toml"
          grep -q '^minimum-gas-prices = "1000000000asobya"$' "$SOBYA_HOME/config/app.toml"
          grep -q "^evm-chain-id = $EVM_CHAIN_ID$" "$SOBYA_HOME/config/app.toml"
          grep -Eq "^chain-id = ['\"]$CHAIN_ID['\"]$" "$SOBYA_HOME/config/client.toml"

      - name: Independently audit the pre-gentx Genesis and write manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOBYA_HOME/config/genesis.json" "$SOBYA_HOME/config/app.toml" <<'PY'
          import base64, json, re, sys
          from pathlib import Path
          g = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          app_toml = Path(sys.argv[2]).read_text(encoding="utf-8")
          assert g["chain_id"] == "sobya-1", g["chain_id"]
          assert g["genesis_time"] == "2026-11-09T19:32:00Z", g["genesis_time"]
          a = g["app_state"]
          balances = {x["address"]: {c["denom"]: int(c["amount"]) for c in x["coins"]} for x in a["bank"]["balances"]}
          assert balances["sobya16vtfjdprl33xsqu0fm375lqv2qu9z0qc0097pq"]["asobya"] == 400_000_000 * 10**18
          assert balances["sobya1zhu55fp76czndk6342vn5e7n7t4q8as08t5yw3"]["asobya"] == 450_000_000 * 10**18
          assert balances["sobya19umw830rw5f5pwgfqk4yz976j5nl3h8h8j5a58"]["asobya"] == 10**18
          assert balances["sobya1hmh9jk9gmk7k63qrpl3a9vsylcvrp379v3h0kr"]["asobya"] == 149_999_999 * 10**18
          supply = {x["denom"]: int(x["amount"]) for x in a["bank"]["supply"]}
          assert supply["asobya"] == 1_000_000_000 * 10**18, supply
          assert a["mint"]["params"]["mint_denom"] == "asobya"
          assert a["mint"]["minter"]["inflation"] == "0"
          assert a["evm"]["params"]["evm_denom"] == "asobya"
          assert a["evm"]["params"]["extended_denom_options"]["extended_denom"] == "asobya"
          assert 'minimum-gas-prices = "1000000000asobya"' in app_toml
          assert re.search(r"^evm-chain-id = 357812033857$", app_toml, re.M)
          extension = a["sobya_validator_reserve"]["entries"][0]["value"]
          meta = json.loads(base64.b64decode(extension + "=" * (-len(extension) % 4)))
          assert meta["total_paid_asobya"] == str(10**18), meta
          assert meta["start_time"] == "2026-11-09T19:32:00.000000Z", meta
          print("PASS: chain IDs, genesis time, all fixed allocations, BonyNode 1 SOBY self-bond, 149,999,999 SOBY reserve, exact 1B supply, denoms, fee config and reserve metadata")
          PY

          mkdir -p "$RUNNER_TEMP/sobya-bundle"
          cp "$SOBYA_HOME/config/genesis.json" "$RUNNER_TEMP/sobya-bundle/genesis.json"
          cp "$SOBYA_HOME/config/app.toml" "$RUNNER_TEMP/sobya-bundle/app.toml"
          cp "$SOBYA_HOME/config/client.toml" "$RUNNER_TEMP/sobya-bundle/client.toml"
          cp "$SOBYA_HOME/config/config.toml" "$RUNNER_TEMP/sobya-bundle/config.toml"
          cat > "$RUNNER_TEMP/sobya-bundle/STATUS.txt" <<EOF
          SOBYA PRE-GENTX GENESIS CANDIDATE — NOT FINAL / NOT LAUNCH AUTHORIZATION
          Source commit: 90512106ee2f3c2a38c8f5bab66edc17688fba43
          Binary release: v0.1.0-rc.2 (official Linux AMD64 release asset; SHA256 verified in workflow)
          CometBFT chain ID: sobya-1
          EVM chain ID: 357812033857 (app.toml)
          Genesis time / planned network start: 2026-11-09T19:32:00Z
          BonyNode account: sobya19umw830rw5f5pwgfqk4yz976j5nl3h8h8j5a58
          BonyNode initial self-bond: 1 SOBY = 1000000000000000000 asobya
          Validator reserve remaining: 149999999 SOBY
          Native supply: exactly 1000000000 SOBY
          State: pre-gentx only. BonyNode must review the bundle and generate a signed gentx locally using the exact official binary. No private keys or mnemonic are to be shared.
          Pending: collect and validate gentx; confirm public P2P endpoint is listening; confirm all participating operators; final genesis validation and SHA256 sign-off; immutable launch bundle.
          EOF
          (cd "$RUNNER_TEMP/sobya-bundle" && sha256sum genesis.json app.toml client.toml config.toml > SHA256SUMS)
          tar -czf "$GITHUB_WORKSPACE/sobya-bonynode-pregenesis.tar.gz" -C "$RUNNER_TEMP/sobya-bundle" .
          sha256sum "$GITHUB_WORKSPACE/sobya-bonynode-pregenesis.tar.gz" > "$GITHUB_WORKSPACE/sobya-bonynode-pregenesis.tar.gz.sha256"

      - name: Upload pre-gentx Genesis candidate
        uses: actions/upload-artifact@v4
        with:
          name: sobya-bonynode-pre-gentx-genesis
          path: |
            ${{ github.workspace }}/sobya-bonynode-pregenesis.tar.gz
            ${{ github.workspace }}/sobya-bonynode-pregenesis.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

name: Validator Support Service Tests
on:
  push:
    branches: [main, feature/validator-support-offchain, fix/validator-onboarding-docs-ci]
    paths:
      - 'ops/validator-support/**'
      - '.github/workflows/validator-support-tests.yml'
  pull_request:
    paths:
      - 'ops/validator-support/**'
      - '.github/workflows/validator-support-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/validator-support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Verify gofmt
        run: test -z "$(gofmt -l .)"
      - name: Run race-enabled tests
        run: go test -race ./...
      - name: Run go vet
        run: go vet ./...

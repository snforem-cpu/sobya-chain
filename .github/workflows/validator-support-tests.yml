name: Validator Support Service Tests
on:
  push:
    branches: [feature/validator-support-offchain]
    paths:
      - 'ops/validator-support/**'
      - '.github/workflows/validator-support-tests.yml'
  pull_request:
    paths:
      - 'ops/validator-support/**'
      - '.github/workflows/validator-support-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/validator-support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: gofmt -w .
      - run: go test -race ./...
      - run: go vet ./...

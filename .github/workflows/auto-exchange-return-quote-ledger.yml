name: SOBYA Auto Exchange return quote ledger

on:
  issues:
    types: [opened, reopened, edited, labeled]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sobya-auto-exchange-return-quote-ledger
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  process-return-requests:
    if: github.repository == 'snforem-cpu/sobya-chain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Process all pending SOBY return requests
        env:
          GH_TOKEN: \${{ github.token }}
          GH_REPOSITORY: \${{ github.repository }}
        run: node auto-exchange/process-return-requests.js

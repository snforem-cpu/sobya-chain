name: SOBYA BUY API Safety Tests

on:
  pull_request:
    paths:
      - "buy/**"
      - "buy-api/**"
      - ".github/workflows/sobya-buy-api-tests.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "buy/**"
      - "buy-api/**"
      - ".github/workflows/sobya-buy-api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sobya-buy-api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: buy-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run API, pricing, and safety tests
        run: npm test

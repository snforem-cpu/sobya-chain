name: Solana escrow program checks

on:
  pull_request:
    paths:
      - "cross-chain/solana/**"
      - ".github/workflows/solana-escrow-checks.yml"
  push:
    branches:
      - main
      - feat/sobya-cross-chain-swap-foundation
    paths:
      - "cross-chain/solana/**"
      - ".github/workflows/solana-escrow-checks.yml"

permissions:
  contents: read

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cross-chain/solana/program
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Run unit tests
        run: cargo test
      - name: Compile program crate
        run: cargo check

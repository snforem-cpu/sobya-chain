name: SOBYA Runtime and Restart Test

on:
  workflow_dispatch:
  push:
    branches:
      - maintenance/verify-build
    paths:
      - '.github/workflows/runtime-restart-test.yml'

permissions:
  contents: read

concurrency:
  group: sobya-runtime-restart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-and-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/verify-build

      - name: Extract SOBYA source
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q 26031 -d project
          test -f project/go.mod
          grep -q 'DefaultBondDenom = "usobya"' project/app/config.go
          grep -q 'default_denom: usobya' project/config.yml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: project/go.mod
          cache: true
          cache-dependency-path: project/go.sum

      - name: Build SOBYA node
        working-directory: project
        run: go build -mod=readonly -o ../sobyad ./cmd/sobyad

      - name: Initialize one-validator test chain
        env:
          NET: ${{ runner.temp }}/sobya-runtime
        run: |
          set -euo pipefail
          ./sobyad multi-node \
            --v 1 \
            --output-dir "$NET" \
            --chain-id sobya-runtime-ci-1 \
            --validators-stake-amount 100000000 \
            --list-ports 26657 \
            --starting-ip-address 127.0.0.1 \
            --keyring-backend test \
            --minimum-gas-prices 0usobya
          test -s "$NET/validator0/config/genesis.json"
          test -d "$NET/validator0/data"

      - name: Verify sustained block production for 10 minutes
        env:
          NET: ${{ runner.temp }}/sobya-runtime
        run: |
          set -euo pipefail
          HOME_DIR="$NET/validator0"
          ./sobyad start --home "$HOME_DIR" > "$RUNNER_TEMP/sobya-runtime.log" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:26657/status > "$RUNNER_TEMP/status.json"; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat "$RUNNER_TEMP/sobya-runtime.log"; exit 1; fi
            sleep 2
          done
          test "$READY" -eq 1

          START_HEIGHT="$(jq -r '.result.sync_info.latest_block_height' "$RUNNER_TEMP/status.json")"
          START_TIME="$(date +%s)"
          while [ "$(( $(date +%s) - START_TIME ))" -lt 600 ]; do
            kill -0 "$PID"
            curl -fsS http://127.0.0.1:26657/status > "$RUNNER_TEMP/status.json"
            NETWORK="$(jq -r '.result.node_info.network' "$RUNNER_TEMP/status.json")"
            HEIGHT="$(jq -r '.result.sync_info.latest_block_height' "$RUNNER_TEMP/status.json")"
            test "$NETWORK" = "sobya-runtime-ci-1"
            test "$HEIGHT" -ge "$START_HEIGHT"
            sleep 10
          done

          END_HEIGHT="$(jq -r '.result.sync_info.latest_block_height' "$RUNNER_TEMP/status.json")"
          test "$END_HEIGHT" -gt "$START_HEIGHT"
          echo "PASS: node remained alive for at least 600 seconds; height $START_HEIGHT -> $END_HEIGHT"

      - name: Restart node and verify persisted chain state
        env:
          NET: ${{ runner.temp }}/sobya-runtime
        run: |
          set -euo pipefail
          HOME_DIR="$NET/validator0"
          BEFORE="$(curl -fsS http://127.0.0.1:26657/status | jq -r '.result.sync_info.latest_block_height')"
          pkill -TERM -f '[s]obyad start --home' || true
          for attempt in $(seq 1 30); do
            if ! curl -fsS http://127.0.0.1:26657/status >/dev/null 2>&1; then break; fi
            sleep 1
          done
          ./sobyad start --home "$HOME_DIR" > "$RUNNER_TEMP/sobya-runtime-restart.log" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:26657/status > "$RUNNER_TEMP/restarted-status.json"; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat "$RUNNER_TEMP/sobya-runtime-restart.log"; exit 1; fi
            sleep 2
          done
          test "$READY" -eq 1
          NETWORK="$(jq -r '.result.node_info.network' "$RUNNER_TEMP/restarted-status.json")"
          RESTART_HEIGHT="$(jq -r '.result.sync_info.latest_block_height' "$RUNNER_TEMP/restarted-status.json")"
          test "$NETWORK" = "sobya-runtime-ci-1"
          test "$RESTART_HEIGHT" -ge "$BEFORE"

          ADVANCED=0
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:26657/status > "$RUNNER_TEMP/restarted-status.json"
            NOW="$(jq -r '.result.sync_info.latest_block_height' "$RUNNER_TEMP/restarted-status.json")"
            if [ "$NOW" -gt "$RESTART_HEIGHT" ]; then ADVANCED=1; RESTART_HEIGHT="$NOW"; break; fi
            sleep 2
          done
          test "$ADVANCED" -eq 1
          echo "PASS: same node home restarted; chain=$NETWORK; persisted height=$BEFORE; resumed height=$RESTART_HEIGHT"

      - name: Upload logs if the test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sobya-runtime-restart-failure-logs
          path: |
            ${{ runner.temp }}/sobya-runtime.log
            ${{ runner.temp }}/sobya-runtime-restart.log
            ${{ runner.temp }}/status.json
            ${{ runner.temp }}/restarted-status.json
          if-no-files-found: ignore
          retention-days: 7

name: SOBYA Network CLI Inspection

on:
  push:
    branches:
      - maintenance/verify-build
    paths:
      - '.github/workflows/inspect-network-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/verify-build

      - name: Extract source and inspect actual network commands
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q 26031 -d project
          echo '=== testnet_multi_node.go ==='
          if [ -f project/cmd/sobyad/cmd/testnet_multi_node.go ]; then
            sed -n '1,520p' project/cmd/sobyad/cmd/testnet_multi_node.go
          else
            echo 'FILE_NOT_FOUND'
          fi
          echo '=== testnet command registration and related command files ==='
          grep -RInE 'NewTestnet|testnet_multi_node|testnet.*Command|AddCommand.*testnet|multi-node' project/cmd/sobyad/cmd project/app --include='*.go' | head -240 || true
          echo '=== node config defaults ==='
          grep -nE 'P2P|p2p|persistent_peers|seeds|external_address|laddr|proxy_app|rpc' project/config.yml | head -120 || true
          echo '=== command registration ==='
          sed -n '1,100p' project/cmd/sobyad/cmd/commands.go
          echo '=== testnet multi-node source continuation ==='
          sed -n '281,520p' project/cmd/sobyad/cmd/testnet_multi_node.go
          echo '=== source module and SDK versions ==='
          grep -nE 'cosmos-sdk|cometbft|tendermint' project/go.mod | head -40

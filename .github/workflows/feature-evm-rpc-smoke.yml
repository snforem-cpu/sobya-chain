name: SOBYA EVM JSON-RPC Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'sobya/**'
      - '.github/workflows/feature-evm-rpc-smoke.yml'

permissions:
  contents: read

concurrency:
  group: sobya-evm-rpc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evm-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sobya/go.mod
          cache: true
          cache-dependency-path: sobya/go.sum

      - name: Build SOBYA node
        working-directory: sobya
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          go mod download all
          go mod verify
          go test -mod=readonly ./...
          go build -mod=readonly -o ../sobyad ./cmd/sobyad

      - name: Initialize chain and enable EVM JSON-RPC
        env:
          SOBYA_HOME: ${{ runner.temp }}/sobya-evm-rpc
        shell: bash
        run: |
          set -euo pipefail
          ./sobyad init "SOBYA EVM RPC CI" --chain-id sobya-evm-rpc-ci-1 --home "$SOBYA_HOME"
          jq -e --arg expected "sobya-evm-rpc-ci-1" '.chain_id == $expected' "$SOBYA_HOME/config/genesis.json" >/dev/null
          ./sobyad keys add validator --keyring-backend test --home "$SOBYA_HOME" --output json > "$RUNNER_TEMP/validator-key.json"
          VALIDATOR_ADDRESS="$(jq -r '.address' "$RUNNER_TEMP/validator-key.json")"
          test -n "$VALIDATOR_ADDRESS"
          ./sobyad genesis add-genesis-account "$VALIDATOR_ADDRESS" 1000000000000000000000000asobya --home "$SOBYA_HOME"
          ./sobyad genesis gentx validator 1000000000000000000000asobya --chain-id sobya-evm-rpc-ci-1 --keyring-backend test --home "$SOBYA_HOME"
          ./sobyad genesis collect-gentxs --home "$SOBYA_HOME"
          python3 - "$SOBYA_HOME/config/app.toml" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          pattern = r'(?ms)^\[json-rpc\]\n.*?(?=^\[|\Z)'
          match = re.search(pattern, text)
          if not match:
              raise SystemExit("Missing [json-rpc] section in generated app.toml")
          section = match.group(0)
          if re.search(r'(?m)^enable\s*=', section):
              section = re.sub(r'(?m)^enable\s*=.*$', 'enable = true', section)
          else:
              section += '\nenable = true\n'
          if re.search(r'(?m)^address\s*=', section):
              section = re.sub(r'(?m)^address\s*=.*$', 'address = "127.0.0.1:8545"', section)
          text = text[:match.start()] + section + text[match.end():]
          text = re.sub(r'(?m)^minimum-gas-prices\s*=.*$', 'minimum-gas-prices = "0asobya"', text, count=1)
          path.write_text(text)
          PY
          grep -A8 '^\[json-rpc\]' "$SOBYA_HOME/config/app.toml"

      - name: Start node and verify Ethereum JSON-RPC
        env:
          SOBYA_HOME: ${{ runner.temp }}/sobya-evm-rpc
        shell: bash
        run: |
          set -euo pipefail
          ./sobyad start --chain-id sobya-evm-rpc-ci-1 --home "$SOBYA_HOME" > "$RUNNER_TEMP/sobya-evm-rpc.log" 2>&1 &
          NODE_PID=$!
          cleanup() {
            kill "$NODE_PID" 2>/dev/null || true
            for attempt in $(seq 1 10); do
              if ! kill -0 "$NODE_PID" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$NODE_PID" 2>/dev/null; then
              kill -KILL "$NODE_PID" 2>/dev/null || true
            fi
            wait "$NODE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          rpc() {
            local method="$1" params="$2" output="$3"
            curl --connect-timeout 2 --max-time 10 -fsS \
              -H 'Content-Type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\",\"params\":$params}" \
              http://127.0.0.1:8545 > "$output"
            jq -e '.error == null and .result != null' "$output" >/dev/null
          }

          READY=0
          for attempt in $(seq 1 90); do
            if ! kill -0 "$NODE_PID" 2>/dev/null; then cat "$RUNNER_TEMP/sobya-evm-rpc.log"; exit 1; fi
            if rpc web3_clientVersion '[]' "$RUNNER_TEMP/readiness.json"; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "EVM JSON-RPC did not answer web3_clientVersion on 127.0.0.1:8545"
            cat "$RUNNER_TEMP/sobya-evm-rpc.log"
            exit 1
          fi

          BLOCK_READY=0
          for attempt in $(seq 1 90); do
            rpc eth_blockNumber '[]' "$RUNNER_TEMP/block-ready.json"
            BLOCK_HEX="$(jq -r '.result' "$RUNNER_TEMP/block-ready.json")"
            if [ "$(python3 -c 'import sys; print(int(sys.argv[1], 16))' "$BLOCK_HEX")" -ge 1 ]; then
              BLOCK_READY=1
              break
            fi
            sleep 2
          done
          if [ "$BLOCK_READY" -ne 1 ]; then
            echo "EVM RPC started but no block was produced"
            cat "$RUNNER_TEMP/sobya-evm-rpc.log"
            exit 1
          fi

          rpc eth_chainId '[]' "$RUNNER_TEMP/chain-id.json"
          rpc net_version '[]' "$RUNNER_TEMP/net-version.json"
          rpc eth_blockNumber '[]' "$RUNNER_TEMP/block-number.json"
          rpc web3_clientVersion '[]' "$RUNNER_TEMP/client-version.json"
          rpc eth_getBlockByNumber '["latest",false]' "$RUNNER_TEMP/latest-block.json"

          python3 - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          read = lambda name: json.loads((p / name).read_text())["result"]
          chain_id = int(read("chain-id.json"), 16)
          network = int(read("net-version.json"))
          height = int(read("block-number.json"), 16)
          latest = read("latest-block.json")
          assert chain_id == 777777, f"unexpected EVM chain ID: {chain_id}"
          assert network == 777777, f"unexpected net_version: {network}"
          assert height >= 1, f"no EVM block produced: {height}"
          assert latest and int(latest["number"], 16) == height, "latest block RPC mismatch"
          print(f"PASS: eth_chainId={chain_id}, net_version={network}, block={height}")
          print(f"PASS: web3_clientVersion={read('client-version.json')}")
          PY

      - name: Upload EVM node log for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sobya-evm-rpc-failure
          path: ${{ runner.temp }}/sobya-evm-rpc.log
          if-no-files-found: ignore
          retention-days: 7

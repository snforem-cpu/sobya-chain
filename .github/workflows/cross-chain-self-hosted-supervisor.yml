name: Cross-chain self-hosted supervisor tests

on:
  pull_request:
    paths:
      - "cross-chain/observer/self_hosted_supervisor.py"
      - "cross-chain/observer/rpc_probes.py"
      - "cross-chain/observer/test_rpc_probes.py"
      - "cross-chain/observer/test_self_hosted_supervisor.py"
      - "cross-chain/observer/requirements.txt"
      - ".github/workflows/cross-chain-self-hosted-supervisor.yml"
  push:
    branches:
      - "feat/sobya-cross-chain-swap-foundation"
    paths:
      - "cross-chain/observer/self_hosted_supervisor.py"
      - "cross-chain/observer/rpc_probes.py"
      - "cross-chain/observer/test_rpc_probes.py"
      - "cross-chain/observer/test_self_hosted_supervisor.py"
      - "cross-chain/observer/requirements.txt"
      - ".github/workflows/cross-chain-self-hosted-supervisor.yml"

permissions:
  contents: read

jobs:
  supervisor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run observer supervisor and RPC probe tests
        run: |
          python -m pip install -r cross-chain/observer/requirements.txt
          cd cross-chain/observer
          python -m unittest -v test_self_hosted_supervisor.py test_rpc_probes.py

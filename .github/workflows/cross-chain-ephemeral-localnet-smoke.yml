name: Cross-chain ephemeral localnet smoke

on:
  pull_request:
    paths:
      - "contracts/**"
      - "cross-chain/solana/**"
      - "cross-chain/observer/**"
      - "cross-chain/coordinator/**"
      - ".github/workflows/cross-chain-ephemeral-localnet-smoke.yml"
  push:
    branches:
      - "feat/sobya-cross-chain-swap-foundation"
    paths:
      - "contracts/**"
      - "cross-chain/solana/**"
      - "cross-chain/observer/**"
      - "cross-chain/coordinator/**"
      - ".github/workflows/cross-chain-ephemeral-localnet-smoke.yml"

permissions:
  contents: read

jobs:
  ethereum-anvil:
    name: Ethereum local EVM (Anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Start ephemeral Anvil node
        run: |
          anvil --host 127.0.0.1 --port 8545 > /tmp/anvil.log 2>&1 &
          echo $! > /tmp/anvil.pid
          for attempt in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = "31337"
      - name: Run escrow state-machine tests against local EVM
        working-directory: contracts
        run: forge test -vvv
      - name: Stop Anvil
        if: always()
        run: if [ -f /tmp/anvil.pid ]; then kill "$(cat /tmp/anvil.pid)" || true; fi

  solana-local-validator:
    name: Solana local validator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Agave CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Start ephemeral Solana validator
        run: |
          solana-test-validator --reset --quiet > /tmp/solana-validator.log 2>&1 &
          echo $! > /tmp/solana-validator.pid
          for attempt in $(seq 1 60); do
            if solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          solana cluster-version --url http://127.0.0.1:8899
      - name: Run Solana escrow host tests
        working-directory: cross-chain/solana/program
        run: |
          cargo fmt --all -- --check
          cargo test
          cargo check
      - name: Prepare Agave platform-tools cache
        run: mkdir -p "$HOME/.cache/solana"
      - name: Build deployable Solana BPF program
        working-directory: cross-chain/solana/program
        run: cargo build-sbf --force-tools-install --tools-version v1.54
      - name: Deploy program to the ephemeral validator and verify executable account
        working-directory: cross-chain/solana/program
        run: |
          set -euo pipefail
          solana config set --url http://127.0.0.1:8899
          solana-keygen new --no-bip39-passphrase --silent --force --outfile /tmp/sobya-solana-program.json
          solana-keygen new --no-bip39-passphrase --silent --force --outfile /tmp/sobya-solana-payer.json
          solana airdrop 5 --keypair /tmp/sobya-solana-payer.json
          solana program deploy target/deploy/sobya_solana_usdt_escrow.so \
            --program-id /tmp/sobya-solana-program.json \
            --keypair /tmp/sobya-solana-payer.json \
            --url http://127.0.0.1:8899
          PROGRAM_ID="$(solana address --keypair /tmp/sobya-solana-program.json)"
          solana program show "$PROGRAM_ID" --keypair /tmp/sobya-solana-payer.json --url http://127.0.0.1:8899
          solana program show "$PROGRAM_ID" --keypair /tmp/sobya-solana-payer.json --url http://127.0.0.1:8899 | grep -Fq "Executable: Yes"
      - name: Stop Solana validator
        if: always()
        run: if [ -f /tmp/solana-validator.pid ]; then kill "$(cat /tmp/solana-validator.pid)" || true; fi

  scope-guard:
    name: Verify TRON TVM is not misrepresented as EVM-tested
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert TRON integration remains explicitly gated
        run: |
          # Match independent markers so Markdown line wrapping cannot break the guard.
          grep -Fq "TRON Virtual Machine" cross-chain/tron/README.md
          grep -Fq "TRON-distributed Solidity compiler" cross-chain/tron/README.md
          grep -Fq "not a substitute for a TRON-solc build" cross-chain/tron/README.md

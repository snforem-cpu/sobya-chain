name: Verify SOBYA DEX public interface

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "dex/**"
      - "buy-api/src/payment-verification.js"
      - ".github/workflows/verify-dex-ui.yml"
  pull_request:
    paths:
      - "index.html"
      - "dex/**"
      - "buy-api/src/payment-verification.js"
      - ".github/workflows/verify-dex-ui.yml"

permissions:
  contents: read

jobs:
  verify-public-dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate mainnet configuration and fail-closed switches
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('dex/config.json', 'utf8'));
          if (config.chainId !== 357812033857) throw new Error('Wrong SOBYA EVM chain ID');
          if (config.rpcUrl !== 'https://sobya-evm-rpc.nodesafe-dapp.xyz') throw new Error('DEX must use the verified NodeSafe dapp EVM RPC');
          if (config.deploymentStatus !== 'verified') throw new Error('Published contract deployment status missing');
          if (config.tradingEnabled !== false) throw new Error('Public swaps must remain locked until funded-pool tests pass');
          if (config.crossChainOrdersEnabled !== false || config.customerDepositsEnabled !== false) throw new Error('Cross-chain orders and deposits must remain closed without a verified gateway');
          if (config.custodialApiUrl !== '') throw new Error('Unverified custodial gateway URL must not be configured');
          for (const key of ['factory', 'router', 'wrappedSoby']) {
            if (!/^0x[0-9a-fA-F]{40}$/.test(config[key] || '')) throw new Error('Invalid deployed contract address: ' + key);
          }
          const dex = fs.readFileSync('dex/index.html', 'utf8');
          if (!dex.includes('https://sobya-evm-rpc.nodesafe-dapp.xyz')) throw new Error('Wallet connector is not using the current EVM RPC');
          if (!dex.includes("config.crossChainOrdersEnabled!==true") || !dex.includes('!apiHealthy')) throw new Error('Cross-chain quote UI must fail closed');
          const home = fs.readFileSync('index.html', 'utf8');
          for (const oldHost of ['sobya-evm-rpc.nodesafe-app.xyz', 'sobya-rpc.nodesafe-app.xyz', 'sobya-api.nodesafe-app.xyz']) {
            if (home.includes(oldHost)) throw new Error('Stale NodeSafe endpoint remains on the public homepage: ' + oldHost);
          }
          const verifier = fs.readFileSync('buy-api/src/payment-verification.js', 'utf8');
          if (!verifier.includes('https://sobya-evm-rpc.nodesafe-dapp.xyz')) throw new Error('SOBY payout verifier is not using the current EVM RPC');
          console.log('PASS: SOBYA DEX configuration, current EVM RPC, and all safety gates.');
          NODE
      - name: Validate JavaScript syntax in DEX page
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('dex/index.html', 'utf8');
          const scripts = html.split('<script>').slice(1).map(part => part.split('</script>')[0]).filter(source => source.trim() && !source.trim().startsWith('src='));
          if (!scripts.length) throw new Error('No inline DEX application script found');
          for (const [i, source] of scripts.entries()) {
            new Function(source);
            console.log('Inline script ' + (i + 1) + ' parses');
          }
          NODE

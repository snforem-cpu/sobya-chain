name: SOBYA Proof Suite tests

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "proof-suite/**"
      - ".github/workflows/proof-suite-tests.yml"
  pull_request:
    paths:
      - "proof-suite/**"
      - ".github/workflows/proof-suite-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check proof-suite/app.js && node --check proof-suite/proof-core.js
      - name: Run proof payload tests
        run: node --test proof-suite/tests/*.test.mjs

  sobya-rpc-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check SOBYA EVM RPC endpoints
        run: |
          node --input-type=module <<'NODE'
          const endpoints = [
            "https://sobya-evm-rpc.nodesafe-dapp.xyz",
            "https://sobya-evm-rpc.nodesafe-app.xyz"
          ];
          const expectedChainId = "0x534f425941";
          for (const url of endpoints) {
            const preflight = await fetch(url, {
              method: "OPTIONS",
              headers: {
                "Origin": "https://snforem-cpu.github.io",
                "Access-Control-Request-Method": "POST",
                "Access-Control-Request-Headers": "content-type"
              },
              signal: AbortSignal.timeout(15000)
            });
            const allowOrigin = preflight.headers.get("access-control-allow-origin");
            const allowMethods = preflight.headers.get("access-control-allow-methods") || "";
            const allowHeaders = preflight.headers.get("access-control-allow-headers") || "";
            if (!preflight.ok || !(allowOrigin === "*" || allowOrigin === "https://snforem-cpu.github.io")) {
              throw new Error(url + " does not allow browser CORS from SOBYA GitHub Pages (status " + preflight.status + ", ACAO " + allowOrigin + ")");
            }
            if (!allowMethods.toUpperCase().includes("POST") || !allowHeaders.toLowerCase().includes("content-type")) {
              throw new Error(url + " CORS preflight does not allow POST with content-type");
            }
            const response = await fetch(url, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                jsonrpc: "2.0",
                id: 1,
                method: "eth_chainId",
                params: []
              }),
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) throw new Error(url + " returned HTTP " + response.status);
            const body = await response.json();
            if (body.error) throw new Error(url + " RPC error: " + body.error.message);
            if (String(body.result).toLowerCase() !== expectedChainId.toLowerCase()) {
              throw new Error(url + " returned unexpected chain ID: " + body.result);
            }
            const blockResponse = await fetch(url, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                jsonrpc: "2.0",
                id: 2,
                method: "eth_blockNumber",
                params: []
              }),
              signal: AbortSignal.timeout(15000)
            });
            if (!blockResponse.ok) throw new Error(url + " block query returned HTTP " + blockResponse.status);
            const blockBody = await blockResponse.json();
            if (blockBody.error || !/^0x[0-9a-f]+$/i.test(blockBody.result || "")) {
              throw new Error(url + " did not return a valid block height");
            }
            console.log(url + " OK — chainId " + body.result + ", block " + BigInt(blockBody.result));
          }
          NODE

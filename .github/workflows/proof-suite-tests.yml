name: SOBYA Proof Suite tests

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "proof-suite/**"
      - ".github/workflows/proof-suite-tests.yml"
  pull_request:
    paths:
      - "proof-suite/**"
      - ".github/workflows/proof-suite-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check proof-suite/app.js && node --check proof-suite/proof-core.js && node --check proof-suite/invoice-proof/app.js && node --check proof-suite/invoice-proof/core.js && node --check proof-suite/verify-api/client.js && node --check proof-suite/verify-api/core.js
      - name: Test hosted Verify API Worker
        working-directory: proof-suite/verify-api
        run: |
          npm install
          npm test
      - name: Install integration test dependencies
        run: npm install --no-save --package-lock=false ethers@6.13.5 playwright@1.52.0
      - name: Run proof payload and live-chain integration tests
        run: node --test proof-suite/tests/*.test.mjs proof-suite/invoice-proof/tests/*.test.mjs proof-suite/verify-api/tests/*.test.mjs
      - name: Install Chromium for browser integration
        run: npx playwright install --with-deps chromium
      - name: Run browser SDK integration test
        run: node proof-suite/verify-api/tests/browser-smoke.mjs

  sobya-rpc-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check SOBYA EVM RPC endpoints and browser CORS
        run: |
          node --input-type=module <<'NODE'
          const primary = "https://sobya-evm-rpc.nodesafe-dapp.xyz";
          const secondary = "https://sobya-evm-rpc.nodesafe-app.xyz";
          const expectedChainId = "0x534f425941";
          async function checkEndpoint(url) {
            try {
              const preflight = await fetch(url, {
                method: "OPTIONS",
                headers: {
                  "Origin": "https://snforem-cpu.github.io",
                  "Access-Control-Request-Method": "POST",
                  "Access-Control-Request-Headers": "content-type"
                },
                signal: AbortSignal.timeout(15000)
              });
              const allowOrigin = preflight.headers.get("access-control-allow-origin");
              const allowMethods = preflight.headers.get("access-control-allow-methods") || "";
              const allowHeaders = preflight.headers.get("access-control-allow-headers") || "";
              if (!preflight.ok || !(allowOrigin === "*" || allowOrigin === "https://snforem-cpu.github.io")) {
                throw new Error("CORS preflight failed: HTTP " + preflight.status + ", allow-origin=" + allowOrigin);
              }
              if (!allowMethods.toUpperCase().includes("POST") || !allowHeaders.toLowerCase().includes("content-type")) {
                throw new Error("CORS preflight does not allow POST/content-type (methods=" + allowMethods + ", headers=" + allowHeaders + ")");
              }
              const response = await fetch(url, {
                method: "POST",
                headers: { "content-type": "application/json", "Origin": "https://snforem-cpu.github.io" },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_chainId", params: [] }),
                signal: AbortSignal.timeout(15000)
              });
              if (!response.ok) throw new Error("RPC returned HTTP " + response.status);
              const body = await response.json();
              if (body.error) throw new Error("RPC error: " + body.error.message);
              if (String(body.result).toLowerCase() !== expectedChainId.toLowerCase()) {
                throw new Error("Unexpected chain ID: " + body.result);
              }
              const blockResponse = await fetch(url, {
                method: "POST",
                headers: { "content-type": "application/json", "Origin": "https://snforem-cpu.github.io" },
                body: JSON.stringify({ jsonrpc: "2.0", id: 2, method: "eth_blockNumber", params: [] }),
                signal: AbortSignal.timeout(15000)
              });
              if (!blockResponse.ok) throw new Error("Block query returned HTTP " + blockResponse.status);
              const blockBody = await blockResponse.json();
              if (blockBody.error || !/^0x[0-9a-f]+$/i.test(blockBody.result || "")) {
                throw new Error("Invalid block height response");
              }
              const block = BigInt(blockBody.result).toString();
              console.log("PASS " + url + " — chainId " + body.result + ", block " + block + ", CORS preflight allowed");
              return { ok: true, block };
            } catch (error) {
              console.log("FAIL " + url + " — " + (error?.stack || error?.message || String(error)));
              return { ok: false, error };
            }
          }
          const primaryResult = await checkEndpoint(primary);
          if (!primaryResult.ok) {
            throw new Error("Required primary SOBYA RPC failed: " + primary);
          }
          const secondaryResult = await checkEndpoint(secondary);
          if (!secondaryResult.ok) {
            console.log("WARNING: optional fallback RPC is unavailable; primary RPC is healthy.");
          }
          console.log("Required primary RPC passed; fallback status: " + (secondaryResult.ok ? "healthy" : "unavailable") + ".");
          NODE

name: SOBYA Tokenomics Studio free-tool checks

on:
  push:
    branches: [main]
    paths:
      - "tokenomics-studio/**"
      - ".github/workflows/tokenomics-studio-check.yml"
  pull_request:
    paths:
      - "tokenomics-studio/**"
      - ".github/workflows/tokenomics-studio-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("tokenomics-studio/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S | re.I)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline app script; found {len(scripts)}")
          Path("/tmp/tokenomics-studio.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/tokenomics-studio.js
      - name: Test vesting calculation edge cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("tokenomics-studio/index.html").read_text(encoding="utf-8")
          match = re.search(r"function unlockedForSupply\(a,m,supply\)\{[^}]+\}", html)
          if not match:
              raise SystemExit("Could not locate production vesting calculation")
          test = """
          const assert = require('node:assert/strict');
          %s
          const linear = {share:100,tge:20,cliff:0,vesting:12};
          assert.equal(unlockedForSupply(linear,0,1000),200);
          assert.equal(unlockedForSupply(linear,6,1000),600);
          assert.equal(unlockedForSupply(linear,12,1000),1000);
          const immediate = {share:10,tge:0,cliff:0,vesting:0};
          assert.equal(unlockedForSupply(immediate,0,1000),100);
          const cliff = {share:100,tge:0,cliff:3,vesting:9};
          assert.equal(unlockedForSupply(cliff,3,900),0);
          assert.equal(unlockedForSupply(cliff,6,900),300);
          assert.equal(unlockedForSupply(cliff,12,900),900);
          console.log('Vesting model edge cases passed.');
          """ % match.group(0)
          Path("/tmp/tokenomics-model-test.js").write_text(test, encoding="utf-8")
          PY
          node /tmp/tokenomics-model-test.js
      - name: Validate free public tool and required features
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path("tokenomics-studio/index.html").read_text(encoding="utf-8")
          page = Path("tokenomics-studio/buy/index.html").read_text(encoding="utf-8")
          required = [
              'id="overview"', 'id="allocations"', 'id="vesting"',
              'id="analysis"', 'id="scenarios"', 'id="report"',
              'id="allocationRows"', 'id="importBtn"', 'id="exportBtn"',
              'id="downloadCsv"', 'id="printReport"', 'id="importFile"'
          ]
          missing = [item for item in required if item not in app]
          if missing:
              raise SystemExit("Missing app features: " + ", ".join(missing))
          forbidden = [
              "LICENSE_PUBLIC_KEY", "verifyLicenseFile", "license-issuer",
              "100 SOBY", "Payment instructions", "OWNER API PASSWORD",
              "Choose license file", "Sales are open"
          ]
          found = [item for item in forbidden if item in app or item in page]
          if found:
              raise SystemExit("Retired payment/licensing content remains: " + ", ".join(found))
          if "FREE · SOBYA COMMUNITY TOOL" not in app:
              raise SystemExit("Main app must identify itself as a free SOBYA community tool.")
          if "Completely free" not in page or "No payment is accepted" not in page:
              raise SystemExit("Public information page must clearly state the tool is free and accepts no payment.")
          if "fetch(" in app or "XMLHttpRequest" in app or "WebSocket(" in app:
              raise SystemExit("Unexpected external network API usage detected")
          print("Free-tool status and core features validated.")
          PY

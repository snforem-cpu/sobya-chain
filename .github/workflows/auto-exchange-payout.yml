name: SOBYA Auto Exchange payout worker

on:
  workflow_dispatch:
    inputs:
      run_payouts:
        description: "Allow real payouts (leave false for a safe verification run)"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: sobya-auto-exchange-return-refund
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  payout:
    if: github.repository == 'snforem-cpu/sobya-chain' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated exchange dependencies
        working-directory: auto-exchange
        run: npm install --no-audit --no-fund
      - name: Request short-lived D1 bridge identity
        id: d1-auth
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sobya-auto-exchange");
            if (!token) {
              core.setFailed("GitHub OIDC did not return an identity token");
              return;
            }
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Import D1 reservations and synchronize settlement ledger
        working-directory: auto-exchange
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GITHUB_OIDC_TOKEN: ${{ steps.d1-auth.outputs.token }}
          SOBYA_AUTO_EXCHANGE_API_URL: https://sobya-buy-api.snforem.workers.dev
        run: node d1/sync-d1-quotes.js
      - name: Validate payout worker syntax without executing payouts
        working-directory: auto-exchange
        run: node --check payout-worker.js
      - name: Verify deposits and execute eligible SOBY payouts
        if: github.event_name == 'schedule' || inputs.run_payouts == true
        working-directory: auto-exchange
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ETHEREUM_RPC_URL: https://ethereum-rpc.publicnode.com
          SOBYA_EVM_RPC_URL: https://sobya-evm-rpc.nodesafe-dapp.xyz
          SOBYA_PAYOUT_PRIVATE_KEY: ${{ secrets.SOBYA_PAYOUT_PRIVATE_KEY }}
        run: node payout-worker.js

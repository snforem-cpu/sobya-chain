name: SOBYA Auto Exchange tests

on:
  pull_request:
    paths:
      - "auto-exchange/**"
      - ".github/workflows/auto-exchange-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-exchange-tests:
    name: Auto Exchange Node tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-exchange
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete test suite
        run: npm test

name: Cross-chain model tests

on:
  pull_request:
    paths:
      - "cross-chain/model/**"
      - ".github/workflows/cross-chain-model.yml"
  push:
    branches:
      - main
    paths:
      - "cross-chain/model/**"
      - ".github/workflows/cross-chain-model.yml"

permissions:
  contents: read

jobs:
  order-state-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic order-state tests
        run: python -m unittest discover -s cross-chain/model -p 'test_*.py' -v

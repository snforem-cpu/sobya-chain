name: Deploy SOBYA website to GitHub Pages
# Keep each deployment on a fresh push run; do not retry artifact-upload runs in place.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'buy/**'
      - 'tokenomics-studio/**'
      - 'dex/**'
      - 'contracts/**'
      - 'assets/logo/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build DEX contracts
        working-directory: contracts
        run: forge build
      - name: Export browser deployment artifacts
        run: node contracts/script/export-dex-artifacts.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

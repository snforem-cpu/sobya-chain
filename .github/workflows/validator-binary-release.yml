name: SOBYA Validator Binary Release Candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: sobya-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Full Go tests on release source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sobya/go.mod
          cache: true
          cache-dependency-path: sobya/go.sum

      - name: Verify dependencies and run full test suite
        working-directory: sobya
        run: |
          set -euo pipefail
          go mod verify
          go test -count=1 -mod=readonly ./...

  build:
    name: Build Linux ${{ matrix.arch }} operator binary
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sobya/go.mod
          cache: true
          cache-dependency-path: sobya/go.sum

      - name: Build and package
        working-directory: sobya
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p ../dist
          go build -mod=readonly -trimpath \
            -ldflags "-X github.com/cosmos/cosmos-sdk/version.Name=sobya -X github.com/cosmos/cosmos-sdk/version.AppName=sobyad -X github.com/cosmos/cosmos-sdk/version.Version=$RELEASE_VERSION -X github.com/cosmos/cosmos-sdk/version.Commit=$SOURCE_COMMIT" \
            -o ../dist/sobyad ./cmd/sobyad
          if [ "$GOARCH" = "amd64" ]; then
            ../dist/sobyad version
          else
            file ../dist/sobyad
            go version -m ../dist/sobyad
          fi
          tar -czf "../dist/sobyad-${RELEASE_VERSION}-linux-${GOARCH}.tar.gz" -C ../dist sobyad
          cd ../dist
          sha256sum "sobyad-${RELEASE_VERSION}-linux-${GOARCH}.tar.gz" > "SHA256SUMS-${GOARCH}"
          sha256sum -c "SHA256SUMS-${GOARCH}"

      - name: Upload architecture package
        uses: actions/upload-artifact@v4
        with:
          name: sobya-linux-${{ matrix.arch }}
          path: |
            dist/sobyad-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
            dist/SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish pre-mainnet candidate assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: sobya-linux-*
          path: dist
          merge-multiple: true

      - name: Combine and verify checksums
        run: |
          set -euo pipefail
          cd dist
          cat SHA256SUMS-* > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SOBYA ${{ github.ref_name }} (pre-mainnet candidate)
          prerelease: true
          generate_release_notes: true
          files: |
            dist/sobyad-${{ github.ref_name }}-linux-amd64.tar.gz
            dist/sobyad-${{ github.ref_name }}-linux-arm64.tar.gz
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

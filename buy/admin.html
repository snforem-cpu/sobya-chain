<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOBYA BUY — Owner Desk</title><style>
:root{color-scheme:dark;--bg:#061225;--line:#294362;--text:#f2f6ff;--muted:#a9bad4;--green:#6ee7b7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}.wrap{max-width:1000px;margin:24px auto;padding:0 16px}.card,.order{background:#0d1d36;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}input{padding:11px;background:#07172c;border:1px solid var(--line);border-radius:9px;color:white;font:inherit;max-width:100%}button{padding:11px 14px;border:0;border-radius:9px;background:#55b5dc;color:#061225;font-weight:800;font:inherit;cursor:pointer;margin:4px}button:disabled{opacity:.5}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.green{color:var(--green)}.status{color:#e8c77b;min-height:24px}.order{margin:10px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}label{display:block;color:var(--muted);font-size:12px}label input{display:block;width:100%;margin-top:5px}</style></head><body><main class="wrap"><h1>SOBYA BUY — Owner Desk</h1><p class="small">Manual order review and manual price control. Connect the inventory wallet to authorize each action.</p><section class="card"><div class="row"><button id="connect">Connect owner wallet</button><span id="wallet" class="small">Not connected</span></div><p class="small">Required: 0xebdb899fFE84a89e1d576964b640491c135651AD</p><button id="refresh" disabled>Load orders</button><div id="status" class="status"></div></section><section class="card"><h2>Manual SOBY price</h2><div class="row"><label>Price per SOBY (USD)<input id="price" type="number" min="0.00000001" step="any" value="0.005"></label><button id="savePrice" disabled>Save price</button></div><div id="priceStatus" class="small"></div></section><section class="card"><h2>Purchase requests</h2><div id="orders" class="small">Connect and load orders.</div></section></main><script>
const API="https://sobya-chain.snforem.workers.dev",OWNER="0xebdb899fFE84a89e1d576964b640491c135651AD",CHAIN="0x534f425941";const $=id=>document.getElementById(id);let provider,owner;
const api=async(path,body)=>{const r=await fetch(API+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||"API request failed");return d};
async function auth(action,context){const c=await api("/api/admin/challenge",{address:owner,action,context});const signature=await provider.request({method:"personal_sign",params:[c.message,owner]});return {address:owner,nonce:c.nonce,signature,action,context}}
async function connect(){try{provider=window.ethereum;if(!provider?.request)throw Error("Open this page in MetaMask.");const a=await provider.request({method:"eth_requestAccounts"});owner=a[0];if(owner.toLowerCase()!==OWNER.toLowerCase())throw Error("Wrong wallet. Connect the inventory wallet.");await provider.request({method:"wallet_switchEthereumChain",params:[{chainId:CHAIN}]});$("wallet").textContent=owner;$("refresh").disabled=false;$("savePrice").disabled=false;$("status").textContent="Owner wallet connected."}catch(e){$("status").textContent=e.message}}
async function load(){try{$("status").textContent="Requesting owner signature…";const a=await auth("orders:list","manual-orders");const d=await api("/api/admin/manual/orders",{auth:a});$("orders").innerHTML="";if(!d.orders.length){$("orders").textContent="No requests yet.";return}for(const o of d.orders){const el=document.createElement("article");el.className="order";const lines=[["Order",o.id],["Quantity",o.soby_amount+" SOBY"],["Unit price","$"+o.unit_price_usd],["Total","$"+o.total_usd],["Payment network",o.payment_network],["Asset",o.payment_asset],["Amount sent",o.payment_amount],["Transaction",o.payment_tx],["Buyer EVM address",o.buyer_address],["Status",o.status],["Created",new Date(o.created_at*1000).toLocaleString()]];for(const [k,v] of lines){const p=document.createElement("div");p.className="small";p.textContent=k+": "+v;el.append(p)}const tx=document.createElement("input");tx.placeholder="Your SOBYA payout transaction hash (optional)";tx.value=o.payout_tx||"";const sel=document.createElement("select");sel.innerHTML='<option value="submitted">Submitted</option><option value="under_review">Under review</option><option value="paid_confirmed">Payment confirmed</option><option value="completed">SOBY sent — completed</option><option value="rejected">Rejected</option>';sel.value=o.status;const save=document.createElement("button");save.textContent="Save status";save.onclick=async()=>{try{const context=o.id+"|"+sel.value+"|"+tx.value.trim();const a=await auth("order:payout",context);await api("/api/admin/manual/order-status",{auth:a,orderId:o.id,status:sel.value,payoutTx:tx.value.trim()});$("status").textContent="Order updated.";await load()}catch(e){$("status").textContent=e.message}};el.append(sel,tx,save);$("orders").append(el)}$("status").textContent="Loaded "+d.orders.length+" order(s)."}catch(e){$("status").textContent=e.message}}
async function savePrice(){try{const p=Number($("price").value);if(!Number.isFinite(p)||p<=0)throw Error("Enter a positive USD price.");const a=await auth("pricing:update",String(p));await api("/api/admin/manual/price",{auth:a,priceUsd:p});$("priceStatus").textContent="Price saved: $"+p;$("status").textContent="Manual price updated."}catch(e){$("priceStatus").textContent=e.message}}
$("connect").onclick=connect;$("refresh").onclick=load;$("savePrice").onclick=savePrice;
</script></body></html>

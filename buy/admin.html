<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOBYA BUY — Owner Desk</title>
<style>
:root{color-scheme:dark;--bg:#061225;--line:#294362;--text:#f2f6ff;--muted:#a9bad4;--green:#6ee7b7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}.wrap{max-width:1000px;margin:24px auto;padding:0 16px}
.card,.order{background:#0d1d36;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}input,select{padding:11px;background:#07172c;border:1px solid var(--line);border-radius:9px;color:white;font:inherit;max-width:100%}
button{padding:11px 14px;border:0;border-radius:9px;background:#55b5dc;color:#061225;font-weight:800;font:inherit;cursor:pointer;margin:4px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.status{color:#e8c77b;min-height:24px}.order{margin:10px 0}label{display:block;color:var(--muted);font-size:12px}label input{display:block;width:100%;margin-top:5px}.hidden{display:none!important}
</style></head><body><main class="wrap"><h1>SOBYA BUY — Owner Desk</h1>
<p class="small">Manual order review and manual USD price control. Administrator password sign-in; no wallet connection required.</p>
<section class="card" id="loginCard"><h2>Owner sign in</h2><div class="row"><label>Administrator password<input id="password" type="password" autocomplete="current-password" maxlength="512"></label><button id="login">Sign in</button></div><div id="loginStatus" class="status"></div></section>
<div id="desk" class="hidden"><section class="card"><div class="row"><span class="small" style="color:var(--green)">Administrator session active</span><button id="logout">Sign out</button><button id="refresh">Load orders</button></div><div id="status" class="status"></div></section>
<section class="card"><h2>Manual SOBY price</h2><div class="row"><label>Price per SOBY (USD)<input id="price" type="number" min="0.00000001" step="any" value="0.005"></label><button id="savePrice">Save price</button></div><div id="priceStatus" class="small"></div></section>
<section class="card"><h2>Purchase requests</h2><div id="orders" class="small">Load orders to review submitted requests.</div></section></div></main>
<script>
const API="https://sobya-chain.snforem.workers.dev", $=id=>document.getElementById(id);let token=sessionStorage.getItem("sobya_admin_session")||"";
async function api(path,body,method="POST"){const headers={"content-type":"application/json"};if(token)headers.authorization="Bearer "+token;const r=await fetch(API+path,{method,headers,...(method==="GET"?{}:{body:JSON.stringify(body||{})})});const d=await r.json().catch(()=>({error:"invalid_api_response"}));if(!r.ok)throw Error(d.error||"API request failed");return d}
function showDesk(on){$("loginCard").classList.toggle("hidden",on);$("desk").classList.toggle("hidden",!on)}
async function login(){try{$("loginStatus").textContent="Signing in…";const d=await api("/api/admin/login",{password:$("password").value});token=d.token;sessionStorage.setItem("sobya_admin_session",token);$("password").value="";showDesk(true);$("loginStatus").textContent="";await loadPrice();await load()}catch(e){$("loginStatus").textContent=e.message}}
async function logout(){try{if(token)await api("/api/admin/logout",{})}catch{}token="";sessionStorage.removeItem("sobya_admin_session");$("orders").textContent="Sign in and load orders." ;showDesk(false);$("loginStatus").textContent="Signed out."}
async function loadPrice(){try{const d=await api("/api/manual/price",null,"GET");$("price").value=String(d.priceUsd);$("priceStatus").textContent="Current saved price: $"+d.priceUsd+" per SOBY."}catch(e){$("priceStatus").textContent="Could not load saved price: "+e.message}}
async function load(){try{$("status").textContent="Loading purchase requests…";const d=await api("/api/admin/manual/orders",{});$("orders").innerHTML="";if(!d.orders.length){$("orders").textContent="No requests yet.";$("status").textContent="No purchase requests.";return}
for(const o of d.orders){const el=document.createElement("article");el.className="order";const lines=[["Order",o.id],["Quantity",o.soby_amount+" SOBY"],["Unit price","$"+o.unit_price_usd],["Total","$"+o.total_usd],["Payment network",o.payment_network],["Asset",o.payment_asset],["Amount sent",o.payment_amount],["Transaction",o.payment_tx],["Buyer EVM address",o.buyer_address],["Status",o.status],["Created",new Date(o.created_at*1000).toLocaleString()]];
for(const [k,v] of lines){const p=document.createElement("div");p.className="small";p.textContent=k+": "+v;el.append(p)}
const tx=document.createElement("input");tx.placeholder="Your SOBY payout transaction hash (optional)";tx.value=o.payout_tx||"";
const sel=document.createElement("select");sel.innerHTML='<option value="submitted">Submitted</option><option value="under_review">Under review</option><option value="paid_confirmed">Payment confirmed</option><option value="completed">SOBY sent — completed</option><option value="rejected">Rejected</option>';sel.value=o.status;
const save=document.createElement("button");save.textContent="Save status";save.onclick=async()=>{try{await api("/api/admin/manual/order-status",{orderId:o.id,status:sel.value,payoutTx:tx.value.trim()});$("status").textContent="Order updated.";await load()}catch(e){$("status").textContent=e.message}};
el.append(sel,tx,save);$("orders").append(el)}$("status").textContent="Loaded "+d.orders.length+" order(s)."}catch(e){$("status").textContent=e.message;if(/session|unauthorized/i.test(e.message))await logout()}}
async function savePrice(){try{const p=Number($("price").value);if(!Number.isFinite(p)||p<=0)throw Error("Enter a positive USD price.");await api("/api/admin/manual/price",{priceUsd:p});$("priceStatus").textContent="Price saved: $"+p+" per SOBY.";$("status").textContent="Manual price updated."}catch(e){$("priceStatus").textContent=e.message}}
$("login").onclick=login;$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});$("logout").onclick=logout;$("refresh").onclick=load;$("savePrice").onclick=savePrice;
if(token){showDesk(true);loadPrice();load()}else showDesk(false);
</script></body></html>
